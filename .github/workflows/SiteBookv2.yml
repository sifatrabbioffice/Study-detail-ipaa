name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen
          xcodegen --version

      - name: Write source files
        run: |
          set -euo pipefail
          mkdir -p Sources/Resources

          cat > project.yml <<'EOF_PROJ'
          name: SiteBook
          options:
            bundleIdPrefix: com.sitebook
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
          settings:
            base:
              SWIFT_VERSION: "5.9"
          targets:
            SiteBook:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.sitebook.app
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_CFBundleDisplayName: SiteBook
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGN_STYLE: Manual
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          schemes:
            SiteBook:
              build:
                targets:
                  SiteBook: all
              run:
                config: Release
              archive:
                config: Release
          EOF_PROJ

          cat > Sources/Models.swift <<'EOF_MODELS'
          import Foundation

          struct Topic: Codable, Identifiable, Hashable {
              var id: Int
              var en: String
              var bn: String
              var phase: String?
              var what: String?
              var why: String?
              var uses: String?
              var steps: [String]?
              var ways: [String]?
              var sources: [String]?
              var examples: [String]?
              var mistakes: [String]?
              var checklist: [String]?
              var tips: [String]?
              var risks: [String]?

              var haystack: String {
                  let all = [en, bn, what ?? "", why ?? "", uses ?? ""]
                      + (steps ?? []) + (ways ?? []) + (sources ?? [])
                      + (examples ?? []) + (mistakes ?? []) + (tips ?? [])
                      + (risks ?? []) + (checklist ?? [])
                  return all.joined(separator: " ").lowercased()
              }
          }
          EOF_MODELS

          cat > Sources/Theme.swift <<'EOF_THEME'
          import SwiftUI

          enum Theme {
              static let bg            = dyn(light: 0xF7F7F8, dark: 0x0E0E10)
              static let surface       = dyn(light: 0xFFFFFF, dark: 0x1A1A1D)
              static let textPrimary   = dyn(light: 0x111114, dark: 0xF2F2F5)
              static let textSecondary = dyn(light: 0x6B6B72, dark: 0x9A9AA3)
              static let divider       = dyn(light: 0xE4E4E9, dark: 0x2A2A2F)
              static let accent        = dyn(light: 0x0F6E6B, dark: 0x3FA39F)
              static let risk          = dyn(light: 0xB42318, dark: 0xF97066)
              static let warn          = dyn(light: 0xB54708, dark: 0xFDB022)
              static let success       = dyn(light: 0x067647, dark: 0x47CD89)

              static func dyn(light: UInt32, dark: UInt32) -> Color {
                  Color(uiColor: UIColor { traits in
                      UIColor(rgb: traits.userInterfaceStyle == .dark ? dark : light)
                  })
              }
          }

          extension UIColor {
              convenience init(rgb: UInt32) {
                  self.init(
                      red: CGFloat((rgb >> 16) & 0xFF) / 255,
                      green: CGFloat((rgb >> 8) & 0xFF) / 255,
                      blue: CGFloat(rgb & 0xFF) / 255,
                      alpha: 1
                  )
              }
          }
          EOF_THEME

          cat > Sources/Store.swift <<'EOF_STORE'
          import Foundation

          final class Store: ObservableObject {
              @Published private(set) var topics: [Topic] = []
              @Published private(set) var loadError: String?

              @Published var favs: Set<Int> = [] { didSet { save() } }
              @Published var done: Set<Int> = [] { didSet { save() } }
              @Published var checked: [String: Set<Int>] = [:] { didSet { save() } }
              @Published var notes: [String: String] = [:]
              @Published var lastReadId: Int? { didSet { UserDefaults.standard.set(lastReadId, forKey: "lastReadId") } }

              private var notesSaveWork: DispatchWorkItem?

              init() {
                  load()
                  restore()
              }

              // MARK: - Load
              private func load() {
                  guard let url = Bundle.main.url(forResource: "topics", withExtension: "json") else {
                      loadError = "topics.json not found in bundle. Ensure Sources/Resources/topics.json is present."
                      topics = []
                      return
                  }
                  do {
                      let data = try Data(contentsOf: url)
                      topics = try JSONDecoder().decode([Topic].self, from: data)
                          .sorted { $0.id < $1.id }
                  } catch {
                      loadError = "Failed to decode topics.json: \(error.localizedDescription)"
                      topics = []
                  }
              }

              func reload() { load() }

              // MARK: - Persistence
              private func restore() {
                  let u = UserDefaults.standard
                  favs = Set(u.array(forKey: "favs") as? [Int] ?? [])
                  done = Set(u.array(forKey: "done") as? [Int] ?? [])
                  notes = u.dictionary(forKey: "notes") as? [String: String] ?? [:]
                  if let raw = u.dictionary(forKey: "checked") as? [String: [Int]] {
                      checked = raw.mapValues { Set($0) }
                  }
                  if let id = u.object(forKey: "lastReadId") as? Int { lastReadId = id }
              }

              private func save() {
                  let u = UserDefaults.standard
                  u.set(Array(favs), forKey: "favs")
                  u.set(Array(done), forKey: "done")
                  u.set(checked.mapValues { Array($0) }, forKey: "checked")
              }

              // MARK: - Notes (debounced)
              func setNote(topicId: Int, text: String) {
                  notes["\(topicId)"] = text
                  notesSaveWork?.cancel()
                  let snapshot = notes
                  let work = DispatchWorkItem {
                      UserDefaults.standard.set(snapshot, forKey: "notes")
                  }
                  notesSaveWork = work
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.4, execute: work)
              }

              func flushNotes() {
                  notesSaveWork?.cancel()
                  UserDefaults.standard.set(notes, forKey: "notes")
              }

              // MARK: - Actions
              func toggleFav(_ id: Int) {
                  if favs.contains(id) { favs.remove(id) } else { favs.insert(id) }
              }

              func toggleDone(_ id: Int) {
                  if done.contains(id) { done.remove(id) } else { done.insert(id) }
              }

              func toggleChecked(topicId: Int, itemIndex: Int) {
                  let key = "\(topicId)"
                  var set = checked[key] ?? []
                  if set.contains(itemIndex) { set.remove(itemIndex) } else { set.insert(itemIndex) }
                  checked[key] = set
              }

              func isChecked(topicId: Int, itemIndex: Int) -> Bool {
                  checked["\(topicId)"]?.contains(itemIndex) ?? false
              }

              // MARK: - Derived
              var phases: [String] {
                  var seen = Set<String>()
                  return topics.compactMap { $0.phase }.filter { seen.insert($0).inserted }
              }

              var topicsWithMistakes: Int { topics.filter { !($0.mistakes?.isEmpty ?? true) }.count }
              var topicsWithRisks: Int { topics.filter { !($0.risks?.isEmpty ?? true) }.count }

              func topics(forPhase phase: String) -> [Topic] { topics.filter { $0.phase == phase } }
              func doneCount(inPhase phase: String) -> Int {
                  topics(forPhase: phase).filter { done.contains($0.id) }.count
              }

              var continueTopic: Topic? {
                  if let id = lastReadId, let t = topics.first(where: { $0.id == id }) { return t }
                  return topics.first(where: { !done.contains($0.id) }) ?? topics.first
              }

              var notesSorted: [(topicId: Int, topic: Topic, text: String)] {
                  notes.compactMap { key, text -> (Int, Topic, String)? in
                      guard let id = Int(key),
                            !text.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty,
                            let t = topics.first(where: { $0.id == id }) else { return nil }
                      return (id, t, text)
                  }.sorted { $0.0 < $1.0 }
              }
          }
          EOF_STORE

          cat > Sources/Components.swift <<'EOF_COMPONENTS'
          import SwiftUI

          struct SectionHeader: View {
              let text: String
              var body: some View {
                  Text(text)
                      .font(.caption.weight(.semibold))
                      .tracking(0.4)
                      .textCase(.uppercase)
                      .foregroundStyle(Theme.textSecondary)
                      .padding(.bottom, 12)
              }
          }

          struct BodyText: View {
              let text: String
              var body: some View {
                  Text(text)
                      .font(.body)
                      .lineSpacing(5)
                      .foregroundStyle(Theme.textPrimary)
                      .textSelection(.enabled)
                      .frame(maxWidth: .infinity, alignment: .leading)
              }
          }

          struct BulletItem: View {
              let text: String
              var dotColor: Color = Theme.accent
              var body: some View {
                  HStack(alignment: .firstTextBaseline, spacing: 12) {
                      Circle().fill(dotColor).frame(width: 6, height: 6).offset(y: -3)
                      Text(text)
                          .font(.body).lineSpacing(4)
                          .foregroundStyle(Theme.textPrimary)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .textSelection(.enabled)
                  }
              }
          }

          struct NumberedItem: View {
              let number: Int
              let text: String
              var body: some View {
                  HStack(alignment: .firstTextBaseline, spacing: 12) {
                      Text("\(number)")
                          .font(.system(.subheadline, design: .monospaced).weight(.medium))
                          .foregroundStyle(Theme.textSecondary)
                          .frame(minWidth: 20, alignment: .trailing)
                      Text(text)
                          .font(.body).lineSpacing(4)
                          .foregroundStyle(Theme.textPrimary)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .textSelection(.enabled)
                  }
              }
          }

          struct CalloutSection: View {
              let title: String
              let icon: String
              let color: Color
              let items: [String]
              var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      HStack(spacing: 6) {
                          Image(systemName: icon).foregroundStyle(color)
                          Text(title).font(.subheadline.weight(.semibold)).foregroundStyle(Theme.textPrimary)
                      }
                      .padding(.bottom, 12)
                      VStack(alignment: .leading, spacing: 10) {
                          ForEach(items.indices, id: \.self) { i in
                              BulletItem(text: items[i], dotColor: color)
                          }
                      }
                  }
                  .padding(.leading, 14)
                  .overlay(alignment: .leading) { Rectangle().fill(color).frame(width: 3) }
              }
          }

          struct Hairline: View {
              var body: some View {
                  Rectangle().fill(Theme.divider).frame(height: 1)
              }
          }

          struct StatBlock: View {
              let value: String
              let label: String
              var body: some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Text(value).font(.system(.title2, design: .monospaced).weight(.medium))
                          .foregroundStyle(Theme.textPrimary)
                      Text(label).font(.caption).foregroundStyle(Theme.textSecondary)
                  }
                  .frame(maxWidth: .infinity, alignment: .leading)
              }
          }

          struct ThinBar: View {
              let fraction: Double
              var color: Color = Theme.accent
              var body: some View {
                  GeometryReader { geo in
                      ZStack(alignment: .leading) {
                          Capsule().fill(Theme.divider)
                          Capsule().fill(color)
                              .frame(width: max(0, min(1, fraction)) * geo.size.width)
                      }
                  }
                  .frame(height: 4)
              }
          }
          EOF_COMPONENTS

          cat > Sources/HomeView.swift <<'EOF_HOME'
          import SwiftUI

          struct HomeView: View {
              @EnvironmentObject private var store: Store
              @State private var query = ""
              @State private var phaseFilter: String? = nil
              @State private var onlyFav = false
              @State private var showMenu = false

              var filtered: [Topic] {
                  store.topics.filter { t in
                      (phaseFilter == nil || t.phase == phaseFilter)
                      && (!onlyFav || store.favs.contains(t.id))
                      && (query.isEmpty || t.haystack.contains(query.lowercased()))
                  }
              }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 28) {
                              if let error = store.loadError { errorCard(error) }
                              continueCard
                              overviewStats
                              filterRow
                              topicList
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 16)
                          .padding(.bottom, 40)
                      }
                      .background(Theme.bg)
                      .navigationBarTitleDisplayMode(.inline)
                      .searchable(text: $query,
                                  placement: .navigationBarDrawer(displayMode: .always),
                                  prompt: "Search / খুঁজুন")
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              Text("SiteBook").font(.headline.weight(.semibold))
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              Button { showMenu = true } label: {
                                  Image(systemName: "line.3.horizontal")
                              }
                              .accessibilityLabel("Menu")
                          }
                      }
                      .sheet(isPresented: $showMenu) { MenuSheet() }
                      .navigationDestination(for: Int.self) { id in
                          ReaderView(topicId: id)
                      }
                  }
              }

              private func errorCard(_ message: String) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Label("Data not loaded", systemImage: "exclamationmark.triangle.fill")
                          .font(.subheadline.weight(.semibold))
                          .foregroundStyle(Theme.warn)
                      Text(message).font(.footnote).foregroundStyle(Theme.textSecondary)
                      Button("Retry") { store.reload() }
                          .font(.footnote.weight(.semibold))
                          .foregroundStyle(Theme.accent)
                  }
                  .padding(12)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .background(Theme.surface)
                  .overlay(RoundedRectangle(cornerRadius: 8).stroke(Theme.divider, lineWidth: 1))
                  .clipShape(RoundedRectangle(cornerRadius: 8))
              }

              @ViewBuilder
              private var continueCard: some View {
                  if let t = store.continueTopic {
                      NavigationLink(value: t.id) {
                          VStack(alignment: .leading, spacing: 8) {
                              Text("CONTINUE")
                                  .font(.caption.weight(.semibold)).tracking(0.5)
                                  .foregroundStyle(Theme.textSecondary)
                              Text(t.en).font(.headline).foregroundStyle(Theme.textPrimary)
                                  .multilineTextAlignment(.leading)
                              Text(t.bn).font(.subheadline).foregroundStyle(Theme.textSecondary)
                                  .multilineTextAlignment(.leading)
                              HStack(spacing: 6) {
                                  Circle().fill(Theme.accent).frame(width: 5, height: 5)
                                  Text(t.phase ?? "—").font(.caption).foregroundStyle(Theme.accent)
                              }
                              Hairline().padding(.vertical, 4)
                              HStack {
                                  Text(store.done.contains(t.id) ? "Review" : "Continue")
                                      .font(.subheadline.weight(.semibold))
                                      .foregroundStyle(Theme.accent)
                                  Spacer()
                                  Image(systemName: "arrow.right").foregroundStyle(Theme.accent)
                              }
                          }
                          .padding(16)
                          .background(Theme.surface)
                          .overlay(RoundedRectangle(cornerRadius: 10).stroke(Theme.divider, lineWidth: 1))
                          .clipShape(RoundedRectangle(cornerRadius: 10))
                      }
                      .buttonStyle(.plain)
                  }
              }

              private var overviewStats: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      SectionHeader(text: "Overview")
                      HStack(spacing: 16) {
                          StatBlock(value: "\(store.topics.count)", label: "Topics")
                          StatBlock(value: "\(store.phases.count)", label: "Phases")
                          StatBlock(value: "\(store.done.count)", label: "Done")
                      }
                  }
              }

              private var filterRow: some View {
                  HStack(spacing: 20) {
                      Menu {
                          Button("All phases") { phaseFilter = nil }
                          Divider()
                          ForEach(store.phases, id: \.self) { p in
                              Button(p) { phaseFilter = p }
                          }
                      } label: {
                          HStack(spacing: 4) {
                              Text(phaseFilter ?? "All phases")
                              Image(systemName: "chevron.down").font(.caption2)
                          }
                          .font(.subheadline)
                          .foregroundStyle(phaseFilter == nil ? Theme.textSecondary : Theme.accent)
                      }
                      Button { onlyFav.toggle() } label: {
                          HStack(spacing: 4) {
                              Image(systemName: onlyFav ? "star.fill" : "star")
                              Text("Favorites")
                          }
                          .font(.subheadline)
                          .foregroundStyle(onlyFav ? Theme.accent : Theme.textSecondary)
                      }
                      .accessibilityLabel(onlyFav ? "Showing favorites only" : "Show favorites only")
                      Spacer()
                  }
                  .padding(.vertical, 4)
              }

              private var topicList: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      SectionHeader(text: "Topics")
                      if filtered.isEmpty {
                          Text("No results / কিছু পাওয়া যায়নি")
                              .font(.body).foregroundStyle(Theme.textSecondary)
                              .padding(.vertical, 32)
                      } else {
                          ForEach(Array(filtered.enumerated()), id: \.element.id) { idx, t in
                              NavigationLink(value: t.id) { row(t) }.buttonStyle(.plain)
                              if idx < filtered.count - 1 { Hairline() }
                          }
                      }
                  }
              }

              private func row(_ t: Topic) -> some View {
                  HStack(alignment: .top, spacing: 12) {
                      Text("\(t.id)")
                          .font(.system(.subheadline, design: .monospaced).weight(.medium))
                          .foregroundStyle(Theme.textSecondary)
                          .frame(minWidth: 28, alignment: .leading)
                          .padding(.top, 2)
                      VStack(alignment: .leading, spacing: 3) {
                          Text(t.en).font(.subheadline.weight(.semibold))
                              .foregroundStyle(Theme.textPrimary).multilineTextAlignment(.leading)
                          Text(t.bn).font(.subheadline)
                              .foregroundStyle(Theme.textSecondary).multilineTextAlignment(.leading)
                          HStack(spacing: 6) {
                              Circle().fill(Theme.accent).frame(width: 4, height: 4)
                              Text(t.phase ?? "—").font(.caption).foregroundStyle(Theme.accent)
                          }
                      }
                      Spacer(minLength: 4)
                      if store.done.contains(t.id) {
                          Image(systemName: "checkmark").font(.footnote.weight(.semibold))
                              .foregroundStyle(Theme.success)
                      }
                      if store.favs.contains(t.id) {
                          Image(systemName: "star.fill").font(.footnote)
                              .foregroundStyle(Theme.accent)
                      }
                  }
                  .padding(.vertical, 12)
                  .contentShape(Rectangle())
              }
          }
          EOF_HOME

          cat > Sources/ReaderView.swift <<'EOF_READER'
          import SwiftUI

          struct ReaderView: View {
              @EnvironmentObject private var store: Store
              @AppStorage("fontSizeIndex") private var fontSizeIndex: Int = 2
              @State private var showFontSheet = false
              @State private var cur: Int

              init(topicId: Int) {
                  _cur = State(initialValue: topicId)
              }

              private let typeSizes: [DynamicTypeSize] = [.small, .medium, .large, .xLarge, .xxLarge, .xxxLarge]
              private var dynamicTypeSize: DynamicTypeSize {
                  typeSizes[min(max(fontSizeIndex, 0), typeSizes.count - 1)]
              }

              private var topic: Topic? { store.topics.first(where: { $0.id == cur }) }
              private var index: Int? { store.topics.firstIndex(where: { $0.id == cur }) }

              var body: some View {
                  Group {
                      if let t = topic { content(t) }
                      else { Text("Topic not found.").foregroundStyle(Theme.textSecondary) }
                  }
                  .background(Theme.bg)
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .principal) {
                          Text("\(cur) / \(store.topics.count)")
                              .font(.system(.caption, design: .monospaced))
                              .foregroundStyle(Theme.textSecondary)
                      }
                      ToolbarItem(placement: .topBarTrailing) {
                          Menu {
                              Button { store.toggleFav(cur) } label: {
                                  Label(store.favs.contains(cur) ? "Remove favorite" : "Add to favorites",
                                        systemImage: store.favs.contains(cur) ? "star.slash" : "star")
                              }
                              Button { showFontSheet = true } label: {
                                  Label("Text size", systemImage: "textformat.size")
                              }
                              if let t = topic {
                                  ShareLink(item: shareText(t)) { Label("Share", systemImage: "square.and.arrow.up") }
                              }
                          } label: { Image(systemName: "ellipsis.circle") }
                          .accessibilityLabel("More")
                      }
                  }
                  .dynamicTypeSize(dynamicTypeSize)
                  .sheet(isPresented: $showFontSheet) {
                      FontSheet(selection: $fontSizeIndex, options: typeSizes)
                  }
                  .onAppear { store.lastReadId = cur }
                  .onDisappear { store.flushNotes() }
              }

              private func content(_ t: Topic) -> some View {
                  ScrollView {
                      VStack(alignment: .leading, spacing: 32) {
                          header(t)
                          if let what = t.what, !what.isEmpty { block { BodyText(text: what) } }
                          if let why = t.why, !why.isEmpty {
                              block(accent: Theme.warn) {
                                  SectionHeader(text: "কেন করা হয়?")
                                  BodyText(text: why)
                              }
                          }
                          if let uses = t.uses, !uses.isEmpty {
                              block { SectionHeader(text: "ব্যবহার"); BodyText(text: uses) }
                          }
                          if let steps = t.steps, !steps.isEmpty {
                              block {
                                  SectionHeader(text: "ধাপসমূহ")
                                  VStack(alignment: .leading, spacing: 12) {
                                      ForEach(Array(steps.enumerated()), id: \.offset) { i, s in
                                          NumberedItem(number: i + 1, text: s)
                                      }
                                  }
                              }
                          }
                          if let ways = t.ways, !ways.isEmpty {
                              block {
                                  SectionHeader(text: "পদ্ধতি")
                                  VStack(alignment: .leading, spacing: 10) {
                                      ForEach(ways.indices, id: \.self) { i in BulletItem(text: ways[i]) }
                                  }
                              }
                          }
                          if let examples = t.examples, !examples.isEmpty {
                              block {
                                  SectionHeader(text: "উদাহরণ")
                                  VStack(alignment: .leading, spacing: 12) {
                                      ForEach(Array(examples.enumerated()), id: \.offset) { i, s in
                                          NumberedItem(number: i + 1, text: s)
                                      }
                                  }
                              }
                          }
                          if let mistakes = t.mistakes, !mistakes.isEmpty {
                              CalloutSection(title: "সাধারণ ভুল",
                                             icon: "exclamationmark.triangle.fill",
                                             color: Theme.warn, items: mistakes)
                          }
                          if let risks = t.risks, !risks.isEmpty {
                              CalloutSection(title: "ঝুঁকি",
                                             icon: "flame.fill",
                                             color: Theme.risk, items: risks)
                          }
                          if let tips = t.tips, !tips.isEmpty {
                              block {
                                  SectionHeader(text: "টিপস")
                                  VStack(alignment: .leading, spacing: 10) {
                                      ForEach(tips.indices, id: \.self) { i in BulletItem(text: tips[i]) }
                                  }
                              }
                          }
                          if let checklist = t.checklist, !checklist.isEmpty {
                              checklistSection(topicId: t.id, items: checklist)
                          }
                          if let sources = t.sources, !sources.isEmpty {
                              block {
                                  SectionHeader(text: "সোর্স")
                                  VStack(alignment: .leading, spacing: 8) {
                                      ForEach(sources.indices, id: \.self) { i in
                                          Text(sources[i]).font(.footnote).foregroundStyle(Theme.textSecondary)
                                      }
                                  }
                              }
                          }
                          notesSection(topicId: t.id)
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 20)
                      .padding(.bottom, 32)
                  }
                  .safeAreaInset(edge: .bottom) { bottomBar(t) }
              }

              private func header(_ t: Topic) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      if let phase = t.phase {
                          HStack(spacing: 6) {
                              Circle().fill(Theme.accent).frame(width: 5, height: 5)
                              Text(phase).font(.caption.weight(.semibold)).tracking(0.4)
                                  .foregroundStyle(Theme.textSecondary)
                          }
                      }
                      Text(t.en).font(.title.weight(.bold)).foregroundStyle(Theme.textPrimary)
                      Text(t.bn).font(.title3).lineSpacing(4).foregroundStyle(Theme.textSecondary)
                      Hairline().padding(.top, 12)
                  }
              }

              @ViewBuilder
              private func block<C: View>(accent: Color? = nil, @ViewBuilder content: () -> C) -> some View {
                  if let accent = accent {
                      VStack(alignment: .leading, spacing: 0) { content() }
                          .padding(.leading, 14)
                          .overlay(alignment: .leading) { Rectangle().fill(accent).frame(width: 3) }
                  } else {
                      VStack(alignment: .leading, spacing: 0) { content() }
                  }
              }

              private func checklistSection(topicId: Int, items: [String]) -> some View {
                  VStack(alignment: .leading, spacing: 0) {
                      SectionHeader(text: "চেকলিস্ট")
                      VStack(alignment: .leading, spacing: 10) {
                          ForEach(items.indices, id: \.self) { i in
                              Button {
                                  store.toggleChecked(topicId: topicId, itemIndex: i)
                              } label: {
                                  HStack(alignment: .top, spacing: 10) {
                                      Image(systemName: store.isChecked(topicId: topicId, itemIndex: i)
                                            ? "checkmark.square.fill" : "square")
                                          .foregroundStyle(store.isChecked(topicId: topicId, itemIndex: i)
                                                           ? Theme.success : Theme.textSecondary)
                                      Text(items[i]).font(.body).lineSpacing(4)
                                          .foregroundStyle(Theme.textPrimary)
                                          .multilineTextAlignment(.leading)
                                          .frame(maxWidth: .infinity, alignment: .leading)
                                  }
                              }
                              .buttonStyle(.plain)
                          }
                      }
                  }
              }

              private func notesSection(topicId: Int) -> some View {
                  let binding = Binding<String>(
                      get: { store.notes["\(topicId)"] ?? "" },
                      set: { store.setNote(topicId: topicId, text: $0) }
                  )
                  return VStack(alignment: .leading, spacing: 0) {
                      SectionHeader(text: "আমার নোট")
                      TextEditor(text: binding)
                          .font(.body)
                          .scrollContentBackground(.hidden)
                          .frame(minHeight: 100)
                          .padding(8)
                          .background(Theme.surface)
                          .overlay(RoundedRectangle(cornerRadius: 8).stroke(Theme.divider, lineWidth: 1))
                          .clipShape(RoundedRectangle(cornerRadius: 8))
                  }
              }

              private func bottomBar(_ t: Topic) -> some View {
                  HStack {
                      Button {
                          store.toggleDone(t.id)
                      } label: {
                          HStack(spacing: 6) {
                              Image(systemName: store.done.contains(t.id) ? "checkmark.circle.fill" : "circle")
                              Text(store.done.contains(t.id) ? "Done" : "Mark done")
                          }
                          .font(.subheadline.weight(.semibold))
                          .foregroundStyle(store.done.contains(t.id) ? Theme.success : Theme.accent)
                      }
                      Spacer()
                      HStack(spacing: 12) {
                          Button { goPrev() } label: { Image(systemName: "chevron.left") }
                              .disabled(!canGoPrev)
                              .accessibilityLabel("Previous topic")
                          Text("\(index.map { $0 + 1 } ?? 0) / \(store.topics.count)")
                              .font(.system(.caption, design: .monospaced))
                              .foregroundStyle(Theme.textSecondary)
                          Button { goNext() } label: { Image(systemName: "chevron.right") }
                              .disabled(!canGoNext)
                              .accessibilityLabel("Next topic")
                      }
                      .foregroundStyle(Theme.accent)
                  }
                  .padding(.horizontal, 20)
                  .padding(.vertical, 12)
                  .background(
                      Theme.surface.overlay(alignment: .top) {
                          Rectangle().fill(Theme.divider).frame(height: 1)
                      }
                  )
              }

              private var canGoPrev: Bool { (index ?? 0) > 0 }
              private var canGoNext: Bool { (index ?? 0) < store.topics.count - 1 }

              private func goPrev() {
                  guard let i = index, i > 0 else { return }
                  store.flushNotes()
                  cur = store.topics[i - 1].id
                  store.lastReadId = cur
              }

              private func goNext() {
                  guard let i = index, i < store.topics.count - 1 else { return }
                  store.flushNotes()
                  cur = store.topics[i + 1].id
                  store.lastReadId = cur
              }

              private func shareText(_ t: Topic) -> String {
                  var o = "\(t.en)\n\(t.bn)\n\n\(t.what ?? "")"
                  if let steps = t.steps {
                      o += "\n\nধাপ:\n" + steps.enumerated().map { "\($0.offset + 1). \($0.element)" }
                          .joined(separator: "\n")
                  }
                  return o
              }
          }
