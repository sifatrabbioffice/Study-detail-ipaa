          echo "files written."

      - name: Validate topics.json
        run: |
          set -euo pipefail
          python3 -c "import json;d=json.load(open('Sources/Resources/topics.json'));print('topics:',len(d))"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          ls -la SiteBook.xcodeproj

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project SiteBook.xcodeproj \
            -scheme SiteBook \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          rm -rf Payload/SiteBook.app
          cp -R build/Build/Products/Release-iphoneos/SiteBook.app Payload/
          ZIP_NAME="SiteBook-unsigned-${GITHUB_SHA::7}.ipa"
          zip -qry "$ZIP_NAME" Payload
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiteBook-ipa-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          if-no-files-found: error
