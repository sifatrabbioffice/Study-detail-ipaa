        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/SiteBook-universal-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "out/SiteBook-universal-release-unsigned-${GITHUB_SHA::7}.apk"
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SiteBook-android-${{ github.sha }}
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error
