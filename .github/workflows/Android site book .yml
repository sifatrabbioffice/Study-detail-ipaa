          @Composable
          fun FontSheet(current: Int, onSelect: (Int) -> Unit) {
              val p = palette
              val labels = listOf("Small", "Medium", "Default", "Large", "X-Large")
              AlertDialog(
                  onDismissRequest = { onSelect(current) },
                  title = { Text("Text size") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
