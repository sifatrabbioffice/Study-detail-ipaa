                  )
                  Spacer(Modifier.width(12.dp))
                  Text(text, style = TextStyle(
                      fontSize = size.sp, lineHeight = line.sp, color = palette.textPrimary))
              }
          }

          @Composable
          fun NumberedItem(
              number: Int, text: String, size: Float = 16f, line: Float = 24f,
          ) {
              Row(verticalAlignment = Alignment.Top) {
                  Text(
                      "$number",
                      style = TextStyle(
                          fontSize = 14.sp,
                          fontFamily = FontFamily.Monospace,
                          fontWeight = FontWeight.Medium,
                          color = palette.textSecondary,
                      ),
                      modifier = Modifier.widthIn(min = 20.dp),
                      textAlign = TextAlign.End,
                  )
                  Spacer(Modifier.width(12.dp))
                  Text(text, style = TextStyle(
                      fontSize = size.sp, lineHeight = line.sp, color = palette.textPrimary))
              }
          }

          @Composable
          fun CalloutSection(
              title: String, icon: ImageVector, color: Color,
              items: List<String>, size: Float = 16f, line: Float = 24f,
          ) {
              Row(Modifier.fillMaxWidth().height(IntrinsicSize.Min)) {
                  Box(Modifier.width(3.dp).fillMaxHeight().background(color))
                  Spacer(Modifier.width(14.dp))
                  Column {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(icon, contentDescription = null, tint = color,
                              modifier = Modifier.size(16.dp))
                          Spacer(Modifier.width(6.dp))
                          Text(title, style = TextStyle(
                              fontSize = 14.sp, fontWeight = FontWeight.SemiBold,
                              color = palette.textPrimary))
                      }
                      Spacer(Modifier.height(12.dp))
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          items.forEach { BulletItem(it, color, size, line) }
                      }
                  }
              }
          }

          @Composable
          fun ThinBar(fraction: Float, modifier: Modifier = Modifier) {
              val p = palette
              Box(modifier.fillMaxWidth().height(4.dp)
                  .background(p.divider, RoundedCornerShape(2.dp))) {
                  Box(Modifier.fillMaxWidth(fraction.coerceIn(0f, 1f))
                      .fillMaxHeight().background(p.accent, RoundedCornerShape(2.dp)))
              }
          }

          @Composable
          fun StatBlock(value: String, label: String, modifier: Modifier = Modifier) {
              val p = palette
              Column(modifier) {
                  Text(value, style = TextStyle(
                      fontSize = 22.sp, fontFamily = FontFamily.Monospace,
