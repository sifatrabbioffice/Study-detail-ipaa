          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ReaderScreen(store: Store, startId: Int, onBack: () -> Unit) {
              val p = palette
              var cur by remember { mutableStateOf(startId) }
              var showFont by remember { mutableStateOf(false) }
              var menuOpen by remember { mutableStateOf(false) }

              val index = store.topics.indexOfFirst { it.id == cur }
              val t = store.topics.getOrNull(index)

              LaunchedEffect(cur) {
                  store.lastReadId = cur
                  store.persist()
              }
              DisposableEffect(cur) {
                  onDispose { store.flushNotes() }
              }

              if (t == null) {
                  Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Text("Topic not found", color = p.textSecondary)
                  }
                  return
              }

              val (bodySize, bodyLine) = when (store.fontSizeIndex) {
                  0 -> 15f to 22f
                  1 -> 16f to 24f
                  2 -> 17f to 26f
                  3 -> 19f to 30f
                  else -> 21f to 32f
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Text("$cur / ${store.topics.size}", style = TextStyle(
                                  fontFamily = FontFamily.Monospace, fontSize = 14.sp,
                                  color = p.textSecondary))
                          },
                          navigationIcon = {
                              IconButton(onClick = onBack) {
                                  Icon(Icons.Default.ArrowBack, contentDescription = "Back",
                                      tint = p.textPrimary)
                              }
                          },
                          actions = {
                              Box {
                                  IconButton(onClick = { menuOpen = true }) {
                                      Icon(Icons.Default.MoreVert, contentDescription = "More",
                                          tint = p.textPrimary)
                                  }
                                  DropdownMenu(expanded = menuOpen,
                                      onDismissRequest = { menuOpen = false }) {
                                      DropdownMenuItem(
                                          text = { Text(if (cur in store.favs)
                                              "Remove favorite" else "Add to favorites") },
                                          onClick = { menuOpen = false; store.toggleFav(cur) })
                                      DropdownMenuItem(
                                          text = { Text("Text size") },
                                          onClick = { menuOpen = false; showFont = true })
                                  }
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(
                              containerColor = p.bg, titleContentColor = p.textSecondary),
                      )
                  },
                  bottomBar = {
                      Row(
                          Modifier.fillMaxWidth().background(p.surface)
                              .padding(horizontal = 20.dp, vertical = 12.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          TextButton(onClick = { store.toggleDone(cur) }) {
                              Icon(
                                  if (cur in store.done) Icons.Default.CheckCircle
                                  else Icons.Default.CheckCircle,
                                  contentDescription = null,
                                  tint = if (cur in store.done) p.success else p.textSecondary,
                              )
                              Spacer(Modifier.width(6.dp))
                              Text(if (cur in store.done) "Done" else "Mark done",
                                  color = if (cur in store.done) p.success else p.accent,
                                  fontWeight = FontWeight.SemiBold)
                          }
                          Spacer(Modifier.weight(1f))
                          IconButton(
                              onClick = {
                                  if (index > 0) {
                                      store.flushNotes()
                                      cur = store.topics[index - 1].id
                                  }
                              },
                              enabled = index > 0,
                          ) {
                              Icon(Icons.Default.ChevronLeft, contentDescription = "Previous",
                                  tint = if (index > 0) p.accent else p.textSecondary)
                          }
                          Text("${index + 1} / ${store.topics.size}", style = TextStyle(
                              fontFamily = FontFamily.Monospace, fontSize = 12.sp,
                              color = p.textSecondary))
                          IconButton(
                              onClick = {
                                  if (index < store.topics.size - 1) {
                                      store.flushNotes()
                                      cur = store.topics[index + 1].id
                                  }
                              },
                              enabled = index < store.topics.size - 1,
                          ) {
                              Icon(Icons.Default.ChevronRight, contentDescription = "Next",
                                  tint = if (index < store.topics.size - 1) p.accent
                                  else p.textSecondary)
                          }
                      }
                  },
                  containerColor = p.bg,
              ) { padding ->
                  Column(
                      modifier = Modifier.padding(padding).fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 20.dp, vertical = 20.dp),
                      verticalArrangement = Arrangement.spacedBy(28.dp),
                  ) {
                      Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          t.phase?.let { ph ->
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(Modifier.size(5.dp).background(p.accent, CircleShape))
                                  Spacer(Modifier.width(6.dp))
                                  Text(ph, style = TextStyle(
                                      fontSize = 12.sp, fontWeight = FontWeight.SemiBold,
                                      letterSpacing = 0.4.sp, color = p.textSecondary))
                              }
                          }
                          Text(t.en, style = TextStyle(
                              fontSize = 28.sp, fontWeight = FontWeight.Bold,
                              color = p.textPrimary))
                          Text(t.bn, style = TextStyle(
                              fontSize = 20.sp, lineHeight = 28.sp, color = p.textSecondary))
                          Spacer(Modifier.height(6.dp))
                          Hairline()
                      }

                      t.what?.takeIf { it.isNotBlank() }?.let { what ->
                          Text(what, style = TextStyle(
                              fontSize = bodySize.sp, lineHeight = bodyLine.sp,
                              color = p.textPrimary))
                      }

                      t.why?.takeIf { it.isNotBlank() }?.let { why ->
                          Row(Modifier.fillMaxWidth().height(IntrinsicSize.Min)) {
                              Box(Modifier.width(3.dp).fillMaxHeight().background(p.warn))
                              Spacer(Modifier.width(14.dp))
                              Column {
                                  SectionHeader("কেন করা হয়?")
                                  Text(why, style = TextStyle(
                                      fontSize = bodySize.sp, lineHeight = bodyLine.sp,
                                      color = p.textPrimary))
                              }
                          }
                      }

                      t.uses?.takeIf { it.isNotBlank() }?.let { uses ->
                          Column {
                              SectionHeader("ব্যবহার")
                              Text(uses, style = TextStyle(
                                  fontSize = bodySize.sp, lineHeight = bodyLine.sp,
                                  color = p.textPrimary))
                          }
                      }

                      t.steps?.takeIf { it.isNotEmpty() }?.let { steps ->
                          Column {
                              SectionHeader("ধাপসমূহ")
                              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  steps.forEachIndexed { i, s ->
                                      NumberedItem(i + 1, s, bodySize, bodyLine)
                                  }
                              }
                          }
                      }

                      t.ways?.takeIf { it.isNotEmpty() }?.let { ways ->
                          Column {
                              SectionHeader("পদ্ধতি")
                              Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  ways.forEach { BulletItem(it, p.accent, bodySize, bodyLine) }
                              }
                          }
                      }

                      t.examples?.takeIf { it.isNotEmpty() }?.let { examples ->
                          Column {
                              SectionHeader("উদাহরণ")
                              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  examples.forEachIndexed { i, s ->
                                      NumberedItem(i + 1, s, bodySize, bodyLine)
                                  }
                              }
                          }
                      }

                      t.mistakes?.takeIf { it.isNotEmpty() }?.let { items ->
                          CalloutSection("সাধারণ ভুল", Icons.Default.Warning, p.warn,
                              items, bodySize, bodyLine)
                      }

                      t.risks?.takeIf { it.isNotEmpty() }?.let { items ->
                          CalloutSection("ঝুঁকি", Icons.Default.Warning, p.risk,
                              items, bodySize, bodyLine)
                      }

                      t.tips?.takeIf { it.isNotEmpty() }?.let { items ->
                          Column {
                              SectionHeader("টিপস")
                              Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  items.forEach { BulletItem(it, p.accent, bodySize, bodyLine) }
                              }
                          }
                      }

                      t.checklist?.takeIf { it.isNotEmpty() }?.let { items ->
                          Column {
                              SectionHeader("চেকলিস্ট")
                              Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  items.forEachIndexed { i, item ->
                                      val c = store.isChecked(t.id, i)
                                      Row(
                                          Modifier.fillMaxWidth()
                                              .clickable { store.toggleChecked(t.id, i) },
                                          verticalAlignment = Alignment.Top,
                                      ) {
                                          Text(if (c) "☑" else "☐", style = TextStyle(
                                              fontSize = 18.sp,
                                              color = if (c) p.success else p.textSecondary))
                                          Spacer(Modifier.width(10.dp))
                                          Text(item, style = TextStyle(
                                              fontSize = bodySize.sp, lineHeight = bodyLine.sp,
                                              color = p.textPrimary))
                                      }
                                  }
                              }
                          }
                      }

                      t.sources?.takeIf { it.isNotEmpty() }?.let { sources ->
                          Column {
                              SectionHeader("সোর্স")
                              sources.forEach {
                                  Text(it, style = TextStyle(
                                      fontSize = 13.sp, color = p.textSecondary),
                                      modifier = Modifier.padding(vertical = 4.dp))
                              }
                          }
                      }

                      Column {
                          SectionHeader("আমার নোট")
                          OutlinedTextField(
                              value = store.notes[cur] ?: "",
                              onValueChange = { store.setNote(cur, it) },
                              modifier = Modifier.fillMaxWidth().heightIn(min = 100.dp),
                              textStyle = TextStyle(fontSize = 16.sp, color = p.textPrimary),
                              colors = OutlinedTextFieldDefaults.colors(
                                  focusedBorderColor = p.divider,
                                  unfocusedBorderColor = p.divider,
                                  focusedContainerColor = p.surface,
                                  unfocusedContainerColor = p.surface,
                              ),
                          )
                      }

                      Spacer(Modifier.height(24.dp))
                  }
              }

              if (showFont) {
                  FontSheet(store.fontSizeIndex) { idx ->
                      store.fontSizeIndex = idx
                      store.persist()
                      showFont = false
                  }
              }
          }
