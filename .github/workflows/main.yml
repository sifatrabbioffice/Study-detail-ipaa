            "why": "মাস্টার প্ল্যান ভুল হলে FAR/MGC লঙ্ঘন হয়, অনুমোদন আটকে যায়, ফায়ার রুট সংকীর্ণ হয়ে যায় এবং ভবিষ্যতে সম্প্রসারণ কঠিন হয়। RAJUK-এর DAP (Detailed Area Plan) অনুযায়ী রাস্তার প্রস্থ অনুসারে FAR ভিন্ন হয়—যেমন ৬ ফুট রাস্তায় Plot FAR=1.5, ৮০ ফুট রাস্তায় Plot FAR=4.5 পর্যন্ত হতে পারে।",
            "steps": [
