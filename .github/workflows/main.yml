name: Build unsigned IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF_PROJ'
          name: SiteBook
          options: {bundleIdPrefix: com.sitebook}
          targets:
            SiteBook:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.sitebook.app
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_CFBundleDisplayName: SiteBook
                  MARKETING_VERSION: 1.0
                  CURRENT_PROJECT_VERSION: 1
          EOF_PROJ
          cat > Sources/App.swift <<'EOF_SWIFT'
          import SwiftUI

          struct Topic: Codable, Identifiable {
              var id: Int
              var en: String
              var bn: String
              var phase: String?
              var what: String?
              var why: String?
              var uses: String?
              var steps: [String]?
              var ways: [String]?
              var sources: [String]?
              var examples: [String]?
          }

          func loadTopics() -> [Topic] {
              guard let u = Bundle.main.url(forResource: "topics", withExtension: "json"),
                    let d = try? Data(contentsOf: u),
                    let t = try? JSONDecoder().decode([Topic].self, from: d) else { return [] }
              return t
          }

          @main struct SiteBookApp: App {
              var body: some Scene { WindowGroup { RootView() } }
          }

          struct RootView: View {
              let topics = loadTopics()
              @State private var sel = 1
              @State private var menu = false
              @State private var q = ""
              var filtered: [Topic] {
                  let s = q.lowercased()
                  if s.isEmpty { return topics }
                  return topics.filter { t in
                      let all = [t.en, t.bn, t.what ?? "", t.why ?? "", t.uses ?? ""] + (t.steps ?? []) + (t.ways ?? []) + (t.sources ?? []) + (t.examples ?? [])
                      return all.joined(separator: " ").lowercased().contains(s)
                  }
              }
              var current: Topic? { topics.first { $0.id == sel } }
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          if let t = current { TopicView(t: t).padding() }
                      }
                      .navigationTitle(current?.en ?? "SiteBook")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button { menu = true } label: { Image(systemName: "line.3.horizontal") }
                          }
                      }
                      .sheet(isPresented: $menu) {
                          NavigationStack {
                              List(filtered) { t in
                                  Button { sel = t.id; menu = false } label: {
                                      VStack(alignment: .leading) {
                                          Text("\(t.id). \(t.en)").font(.headline)
                                          Text(t.bn).font(.subheadline).foregroundColor(.secondary)
                                          Text(t.phase ?? "").font(.caption).foregroundColor(.blue)
                                      }
                                  }
                              }
                              .navigationTitle("সূচিপত্র / Contents")
                              .searchable(text: $q, prompt: "Search / খুঁজুন")
                          }
                      }
                  }
              }
          }

          struct TopicView: View {
              let t: Topic
              func sec(_ title: String, _ items: [String]?, numbered: Bool = false) -> some View {
                  Group {
                      if let items = items, !items.isEmpty {
                          VStack(alignment: .leading, spacing: 6) {
                              Text(title).font(.headline).foregroundColor(.blue)
                              ForEach(Array(items.enumerated()), id: \.offset) { i, s in
                                  Text(numbered ? "\(i+1). \(s)" : "• \(s)")
                              }
                          }
                      }
                  }
              }
              var body: some View {
                  VStack(alignment: .leading, spacing: 16) {
                      Text(t.en).font(.title2).bold()
                      Text(t.bn).font(.title3).foregroundColor(.secondary)
                      Text("ধাপ: " + (t.phase ?? "")).font(.footnote).foregroundColor(.blue)
                      sec("এটা কী? (What)", t.what.map { [$0] })
                      sec("কী করে / ব্যবহার (Use)", t.uses.map { [$0] })
                      sec("কেন করা হয়? (Why)", t.why.map { [$0] })
                      sec("ধাপসমূহ (Steps)", t.steps, numbered: true)
                      sec("পদ্ধতি (Ways)", t.ways)
                      sec("সোর্স (Sources)", t.sources)
                      sec("উদাহরণ (Examples)", t.examples, numbered: true)
                      if t.what == nil {
                          Text("বিস্তারিত তথ্য শিগগিরই যোগ হবে।").italic().foregroundColor(.secondary)
                      }
                  }.frame(maxWidth: .infinity, alignment: .leading)
              }
          }
          EOF_SWIFT
          cat > Sources/topics.json <<'EOF_JSON'
          [
           {
            "id": 1,
            "en": "Soil Test (N-value, Soil Strength)",
            "bn": "মাটি পরীক্ষা (এন-ভ্যালু, মাটির শক্তি)",
            "what": "নির্মাণের আগে মাটির স্তর, ধরন, ঘনত্ব, বহন ক্ষমতা ও ভূগর্ভস্থ পানির অবস্থা জানার জন্য বৈজ্ঞানিক পরীক্ষা। SPT (Standard Penetration Test)-এ ৬৩.৫ কেজি হাতুড়ি ৭৬ সেমি উচ্চতা থেকে ফেলে স্যাম্পলার প্রতি ১৫ সেমি ঢোকানো হয়; শেষ ৩০ সেমিতে প্রয়োজনীয় আঘাত সংখ্যাই N-value। এই N-value থেকেই মাটির শক্তি ও ফাউন্ডেশনের ধরন নির্ধারণ করা হয়।",
            "uses": "ফাউন্ডেশনের ধরন (Shallow/Raft/Pile) নির্বাচন, Allowable Bearing Capacity নির্ধারণ, পাইলের গভীরতা ও সংখ্যা ঠিক করা, ভূমিকম্পজনিত Liquefaction সম্ভাবনা যাচাই এবং স্ট্রাকচারাল ডিজাইনারকে লোড বহনের ইনপুট দেওয়া।",
            "why": "ভুল মাটি-বিশ্লেষণে ভুল ফাউন্ডেশন হলে বিল্ডিং বসে যাওয়া, ফাটল, এমনকি ধসের ঝুঁকি থাকে। BNBC 2020 অনুযায়ী বহুতল ভবনের জন্য SPT-ভিত্তিক জিওটেকনিক্যাল রিপোর্ট বাধ্যতামূলক; এই রিপোর্ট ছাড়া ডিজাইন অনুমোদন পাওয়া যায় না।",
            "steps": [
             "সাইট প্ল্যান দেখে বোরহোলের সংখ্যা ও অবস্থান ঠিক করা (সাধারণত প্রতি ১০০০ বর্গমিটারে ১টি, কমপক্ষে ৩টি)",
             "বোরিং মেশিন দিয়ে নির্দিষ্ট গভীর পর্যন্ত (সাধারণত ২০–৩০ মিটার বা কঠিন স্তর পর্যন্ত) বোরহোল করা",
             "প্রতি ১.৫ মিটার গভীতে SPT চালানো: স্যাম্পলার বসিয়ে ১৫ সেমি ঢুকিয়ে ছেড়ে দেওয়া, এরপর ৪৫ সেমি ঢুকিয়ে শেষ ৩০ সেমির আঘাত গণনা (N-value)",
             "প্রতিটি স্তর থেকে Disturbed ও Undisturbed স্যাম্পল সংগ্রহ করে ল্যাবে পাঠানো",
             "ল্যাবে Grain Size, Atterberg Limits, Consolidation, Direct Shear টেস্ট করানো",
             "বোরলগ, N-value প্রোফাইল ও সয়েল প্রোফাইলসহ জিওটেকনিক্যাল রিপোর্ট তৈরি করা"
            ],
            "ways": [
             "SPT (Standard Penetration Test) – ASTM D1586, BNBC 2020 Appendix D",
             "CPT (Cone Penetration Test) – দ্রুত ও ধারাবাহিক ডেটা দেয়",
             "Plate Load Test – ফাউন্ডেশনের সরাসরি বহন ক্ষমতা মাপা",
             "Lab Test: Grain Size (ASTM D422), Atterberg Limits (ASTM D4318), Consolidation (ASTM D2435)"
            ],
            "sources": [
             "BNBC 2020, Part 6 (Structural Design), Chapter 3 – Soils and Foundations",
             "ASTM D1586 – Standard Test Method for SPT",
             "BUET, DU বা স্বীকৃত জিওটেকনিক্যাল ল্যাবরেটরি"
            ],
            "examples": [
             "১২ তলা ভবনের সাইটে ৮ মিটার গভীরে N=৪ (খুব নরম কাদা) পাওয়া গেলে ২৫–৩০ মিটার গভীর পাইল ফাউন্ডেশন ডিজাইন করতে হবে",
             "৪ তলা ভবনের সাইটে ৫ মিটার গভীরে N=১৮ (মাঝারি শক্ত বালি) পাওয়া গেলে Raft ফাউন্ডেশন যথেষ্ট হতে পারে"
            ],
            "phase": "১. সাইট অনুসন্ধান"
           },
           {
            "id": 2,
            "en": "Survey Drawing of Project Periphery",
            "bn": "প্রজেক্টের সীমানা জরিপ নকশা",
            "what": "জমির প্রকৃত সীমানা, কোণ, বাহুর দৈর্ঘ্য, ভূমির উচ্চতা (Spot Level), কনট্যুর ও আশপাশের রাস্তা-স্থাপনা সমন্বিত টোপোগ্রাফিক সার্ভে নকশা। Total Station বা DGPS দিয়ে প্রতিটি বাউন্ডারি পয়েন্টের Northing-Easting-Elevation রেকর্ড করা হয় এবং CAD-এ প্লট করা হয়।",
            "uses": "জমির সঠিক ক্ষেত্রফল ও সীমানা যাচাই, বাউন্ডারি পাইলারের অবস্থান নির্ধারণ, ভূমি উন্নয়নের জন্য কাট-ফিল পরিমাণ হিসাব, ড্রেনেজ ঢাল ঠিক করা এবং Master Plan ও Building Layout-এর ভিত্তি তৈরি করা।",
            "why": "সীমানা ভুল হলে প্রতিবেশীর সাথে আইনি বিরোধ ও জমি দখলের অভিযোগ ওঠে। ভূমির উচ্চতা না জানলে বর্ষায় পানি জমে, ফিলিং অতিরিক্ত লাগে এবং ড্রেনেজ উল্টো দিকে বইতে পারে। RAJUK অনুমোদনের জন্য সার্ভে নকশা বাধ্যতামূলক।",
            "steps": [
