             "অভ্যন্তরীণ রাস্তা, পার্কিং, ফায়ার লেন ও পথচারী চলাচলের নেটওয়ার্ক আঁকা",
             "STP, WTP, সাবস্টেশন, জেনারেটর ও বর্জ্য সংগ্রহের জন্য জায়গা নির্ধারণ",
             "AutoCAD-এ চূড়ান্ত ২ডি মাস্টার প্ল্যান আঁকা, FAR/MGC হিসাব শিটসহ অনুমোদনের জন্য জমা দেওয়া"
            ],
            "ways": [
             "AutoCAD 2D Drafting (সবচেয়ে প্রচলিত)",
             "Revit/ArchiCAD (BIM-ভিত্তিক মাস্টার প্ল্যান)",
             "GIS-ভিত্তিক ম্যাপিং (বড় টাউনশিপে)",
             "SketchUp + Layout (কনসেপ্ট উপস্থাপনায়)"
            ],
            "sources": [
             "RAJUK – Dhaka Metropolitan Building (Construction, Development, Protection and Conservation) Rules, 2008",
             "RAJUK Detailed Area Plan (DAP)",
             "BNBC 2020, Part 3 – Planning and Development"
