      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project SiteBook.xcodeproj -scheme SiteBook -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/SiteBook.app Payload/
          zip -r SiteBook.ipa Payload
