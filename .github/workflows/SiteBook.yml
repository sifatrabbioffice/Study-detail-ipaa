          "mistakes":["PPE দিয়ে ব্যবহার তদারকি না করা","ছোট ঘটনা লিখে না রাখা"],
          "risks":["জানহানি","কাজ বন্ধ ও জরিমানা"],
          "tips":["সবার চোখে পড়ে এমন নিরাপত্তা বোর্ড রাখুন","জরুরি যোগাযোগ নম্বর গেটে ঝোলান"],
          "checklist":["PPE","JHA","ইন্ডাকশন","প্রাথমিক চিকিৎসা বক্স","ফায়ার এক্সটিংগুইশার"]},
          {"id":68,"en":"Concrete Curing & Waterproofing","bn":"কংক্রিট কিউরিং ও ওয়াটারপ্রুফিং","phase":"৮. কাজ ও মান নিয়ন্ত্রণ",
