          "tips":["ত্রুটির জন্য একটি লগশিট রাখুন","বর্ষার পর একটি বিশেষ পরিদর্শন রাখুন"],
          "checklist":["DLP তারিখ","রিটেনশন","ত্রুটি লগ","চূড়ান্ত পরিদর্শন"]},
          {"id":66,"en":"BOQ & Cost Estimation","bn":"বিওকিউ ও খরচ প্রাক্কলন","phase":"৬. সময়সূচি ও পরিকল্পনা",
          "what":"কাজের প্রতিটি আইটেম, পরিমাণ, একক ও রেট তালিকাভুক্ত করে মোট প্রকল্প ব্যয় নির্ধারণ। BOQ (Bill of Quantities) ড্রয়িং থেকে পরিমাণ বের করে তৈরি হয়।",
          "uses":"বাজেট ঠিক করা, টেন্ডার দেওয়া, ঠিকাদারের বিল যাচাই এবং খরচ নিয়ন্ত্রণ।",
          "why":"ভুল পরিমাণে বাজেট ছাড়িয়ে যায়; স্পষ্ট BOQ ছাড়া ঠিকাদারের সাথে ভ্যারিয়েশন নিয়ে বিরোধ হয়।",
          "steps":["ড্রয়িং ও স্পেসিফিকেশন সংগ্রহ","আইটেম ভাগ করে পরিমাণ হিসাব (Take-off)","স্থানীয় বাজার ও রেট শিডিউল থেকে ইউনিট রেট নির্ধারণ","BOQ ছকে পরিমাণ × রেট = মোট","ওভারহেড, মুনাফা, VAT ও কন্টিনজেন্সি যোগ","পরিবর্তন হলে BOQ রিভিশন"],
