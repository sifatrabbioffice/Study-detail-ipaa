      - name: Check JSON
        run: |
          python3 -c "import json;print('topics:',len(json.load(open('Sources/topics.json'))))"
          python3 -c "import json;print('extras:',len(json.load(open('Sources/extras.json'))))"
      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project SiteBook.xcodeproj -scheme SiteBook -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/SiteBook.app Payload/
          zip -r SiteBook.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SiteBook-ipa
          path: SiteBook.ipa
