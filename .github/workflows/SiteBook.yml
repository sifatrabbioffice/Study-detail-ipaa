          {"id":69,"en":"Billing & Measurement (RA Bill)","bn":"বিলিং ও পরিমাপ (আরএ বিল)","phase":"৫. ক্রয় ও ঠিকাদার",
          "what":"সম্পন্ন কাজের পরিমাণ মেপে চুক্তির রেট অনুযায়ী ঠিকাদারের বিল তৈরি। চলমান কাজে ধাপে ধাপে দেওয়া বিলকে Running Account (RA) Bill বলে।",
          "uses":"সঠিক পরিমাণে সঠিক সময়ে পেমেন্ট এবং খরচের হিসাব রাখা।",
          "why":"মাপজোখ ছাড়া পেমেন্ট দিলে অতিরিক্ত বা কম পেমেন্ট হয়; ঠিকাদারের সাথে সম্পর্ক ও নগদ প্রবাহ প্রভাবিত হয়।",
          "steps":["ঠিকাদার ও ইঞ্জিনিয়ার একসাথে সাইটে কাজ মাপা","পরিমাণ Measurement Book-এ লেখা ও স্বাক্ষর","চুক্তির রেটে বিল হিসাব","আগের বিল, অগ্রিম ও রিটেনশন বিয়োগ","কর/VAT প্রযোজ্য হলে হিসাব","অনুমোদন ও পেমেন্ট"],
          "ways":["Item Rate Billing","Lump Sum Milestone Billing","Final Bill"],
          "sources":["Measurement Book","WO/Contract"],
          "examples":["প্লাস্টারের ১,২০০ বর্গমিটার মেপে রেট দিয়ে আংশিক বিল","অগ্রিম মানি ধাপে ধাপে বিল থেকে সমন্বয়"],
          "mistakes":["না মেপে ঠিকাদারের দাবির ওপর বিল","লুকানো কাজের মাপ ঢাকা পড়ার পরে নেওয়া"],
          "risks":["অতিরিক্ত পেমেন্ট","বিল বিরোধ"],
          "tips":["ঢাকা পড়ার আগে লুকানো কাজ (রড, পাইপ) মাপুন ও ছবি রাখুন","বিলের সাথে প্রগ্রেস ফটো যুক্ত করুন"],
          "checklist":["যৌথ মাপ","MB স্বাক্ষর","রেট যাচাই","অগ্রিম/রিটেনশন সমন্বয়","অনুমোদন"]},
          {"id":70,"en":"Risk Management","bn":"ঝুঁকি ব্যবস্থাপনা","phase":"৩. টিম ও ব্যবস্থাপনা",
          "what":"প্রজেক্টে ঘটতে পারে এমন সমস্যা আগে চিহ্নিত করে সেগুলোর সম্ভাবনা ও প্রভাব মূল্যায়ন করা এবং প্রতিরোধ বা প্রশমন পরিকল্পনা রাখা।",
          "uses":"অপ্রত্যাশিত বিলম্ব, খরচ বৃদ্ধি ও দুর্ঘটনা কমানো।",
          "why":"ঝুঁকি আগে না ভাবলে সমস্যা হলে তাড়াহুড়ো সিদ্ধান্তে ক্ষতি বাড়ে।",
          "steps":["ঝুঁকি চিহ্নিত করা (আবহাওয়া, সরবরাহ, আইনি, নিরাপত্তা)","প্রতিটির সম্ভাবনা ও প্রভাব রেটিং","অগ্রাধিকার সাজানো (Risk Matrix)","প্রতিরোধ/প্রশমন পরিকল্পনা ও দায়িত্ব দেওয়া","নিয়মিত রিভিউ ও আপডেট"],
          "ways":["Risk Register","Risk Matrix (সম্ভাবনা × প্রভাব)","Contingency Reserve"],
          "sources":["PMI PMBOK","ISO 31000"],
          "examples":["বর্ষার আগে ফাউন্ডেশন ও খনন শেষ করার পরিকল্পনা","মূল ভেন্ডর ব্যর্থ হলে দ্বিতীয় ভেন্ডর প্রস্তুত রাখা"],
          "mistakes":["ঝুঁকি তালিকা একবার লিখে ফেলে রাখা","দায়িত্ব ঠিক না করা"],
          "risks":["অপ্রস্তুত অবস্থায় বড় বিলম্ব","বাজেট ছাড়িয়ে যাওয়া"],
          "tips":["সাপ্তাহিক মিটিংয়ে শীর্ষ ৫ ঝুঁকি দেখুন","কন্টিনজেন্সি বাজেট আলাদা রাখুন"],
          "checklist":["রিস্ক রেজিস্টার","মূল্যায়ন","দায়িত্ব","রিভিউ তারিখ"]}
          ]
          EOF_NEWT
          cat > extract.py <<'EOF_EXTRACT'
          import subprocess, json, textwrap, sys
          MARK = "<<'EOF_" + "JSON'"
          END = "EOF_" + "JSON"
          NEED = '"id": ' + '63'
          def sh(*a): return subprocess.check_output(a).decode('utf-8', 'replace')
          for r in sh('git', 'rev-list', 'HEAD').split():
              for f in sh('git', 'ls-tree', '-r', '--name-only', r).split('\n'):
                  if not f.startswith('.github/workflows/'): continue
                  try: s = sh('git', 'show', r + ':' + f)
                  except Exception: continue
                  if MARK in s and NEED in s:
                      lines = s.split('\n'); out = []; on = False
                      for ln in lines:
                          if not on:
                              if MARK in ln: on = True
                              continue
                          if ln.strip() == END: break
                          out.append(ln)
                      data = json.loads(textwrap.dedent('\n'.join(out)))
                      json.dump(data, open('Sources/topics.json', 'w'), ensure_ascii=False, indent=1)
                      print('extracted', len(data), 'topics from', r[:7], f)
                      sys.exit(0)
          print('ERROR: original topics not found in git history'); sys.exit(1)
          EOF_EXTRACT
          cat > enhance.py <<'EOF_ENHANCE'
          import json
          T = json.load(open('Sources/topics.json', encoding='utf-8'))
          ex = json.load(open('Sources/extras.json', encoding='utf-8'))
          new = json.load(open('Sources/newtopics.json', encoding='utf-8'))
          FIX = [
           ('স্যনিটারী', 'স্যানিটারি'), ('সুন্দর্য', 'সৌন্দর্য'), ('বিবোধ', 'বিরোধ'),
           ('গভীতে', 'গভীরতায়'), (' safely ', ' নিরাপদে '), ('পুরোস্তরে', 'পুরো স্তরে'),
           ('স্প্রিংকলার হেডের সংখ্যা ও অবস্থান ঠিক করা (সাধারণত ১২.১ m²/হেড লাইট হ্যাজার্ডে)',
            'স্প্রিংকলার হেডের সংখ্যা ও অবস্থান ঠিক করা (NFPA 13 অনুযায়ী Light Hazard-এ প্রায় ২০ m²/হেড, Ordinary Hazard-এ প্রায় ১২ m²/হেড; প্রকল্পের স্পেক যাচাই করুন)'),
           ('—যেমন ৬ ফুট রাস্তায় Plot FAR=1.5, ৮০ ফুট রাস্তায় Plot FAR=4.5 পর্যন্ত হতে পারে।',
            '। প্রযোজ্য FAR ও সেটব্যাক সর্বশেষ DAP/বিধিমালা থেকে যাচাই করে নিতে হয়।'),
           ('DAP অনুযায়ী ৮০ ফুট রাস্তার প্লটে FAR 4.5 ধরে ১০ তলা ভবনের ভলিউম নিশ্চিত করা',
            'DAP অনুযায়ী প্রযোজ্য FAR ধরে ভবনের সর্বোচ্চ ভলিউম হিসাব করে নিশ্চিত করা'),
           ('প্রেসার টেস্ট (সাধারণত ১০ bar, ১ ঘণ্টা) করে লিক চেক',
            'প্রেসার টেস্ট (পাইপের ধরন ও প্রকল্পের স্পেক অনুযায়ী নির্ধারিত চাপ ও সময়ে) করে লিক চেক'),
           ('প্রেসার টেস্ট (সাধারণত ১৫৯ mm Hg, ১০ মিনিট)', 'প্রেসার টেস্ট (গ্যাস কোম্পানির নির্ধারিত চাপ ও সময় অনুযায়ী)'),
          ]
          cnt = {}
          def fx(s):
              for a, b in FIX:
                  if a in s: cnt[a] = cnt.get(a, 0) + s.count(a); s = s.replace(a, b)
              return s
          def walk(o):
              if isinstance(o, str): return fx(o)
              if isinstance(o, list): return [walk(i) for i in o]
              if isinstance(o, dict): return {k: walk(v) for k, v in o.items()}
              return o
          T = walk(T)
          have = {t['id'] for t in T}
          for n in new:
              if n['id'] not in have: T.append(n)
          for t in T:
              e = ex.get(str(t['id']))
              if e:
                  for k in ('mistakes', 'risks', 'tips', 'checklist'):
                      if e.get(k) and not t.get(k): t[k] = e[k]
          json.dump(T, open('Sources/topics.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('topics:', len(T), 'with extras:', sum(1 for t in T if t.get('tips')))
          print('fixes applied:', len(cnt), 'of', len(FIX))
          for a in cnt: print(' -', a[:40], cnt[a])
          EOF_ENHANCE
      - name: Recover original topics from git history
        run: python3 extract.py
      - name: Fix text, add extras and new topics
        run: |
          python3 enhance.py
          rm -f Sources/newtopics.json
          python3 -c "import json;print('final topics:',len(json.load(open('Sources/topics.json'))))"
      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project SiteBook.xcodeproj -scheme SiteBook -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/SiteBook.app Payload/
          zip -r SiteBook.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SiteBook-ipa
          path: SiteBook.ipa
