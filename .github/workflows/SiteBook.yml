name: Build unsigned IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF_PROJ'
          name: SiteBook
          options: {bundleIdPrefix: com.sitebook}
          targets:
            SiteBook:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.sitebook.app
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_CFBundleDisplayName: SiteBook
                  MARKETING_VERSION: 2.0
                  CURRENT_PROJECT_VERSION: 1
          EOF_PROJ
          cat > Sources/App.swift <<'EOF_SWIFT'
          import SwiftUI

          // MARK: - Model
          struct Topic: Codable, Identifiable, Hashable {
              var id: Int
              var en: String
              var bn: String
              var phase: String?
              var what: String?
              var why: String?
              var uses: String?
              var steps: [String]?
              var ways: [String]?
              var sources: [String]?
              var examples: [String]?
              var keyPoints: [String]?
              var mistakes: [String]?
              var tips: [String]?
              var duration: String?
          }

          func loadTopics() -> [Topic] {
              guard let u = Bundle.main.url(forResource: "topics", withExtension: "json"),
                    let d = try? Data(contentsOf: u),
                    let t = try? JSONDecoder().decode([Topic].self, from: d) else { return [] }
              return t
          }

          // MARK: - Phase Metadata
          struct PhaseInfo {
              let title: String
              let icon: String
              let color: Color
              let gradient: [Color]
          }

          func phaseInfo(_ name: String?) -> PhaseInfo {
              switch name ?? "" {
              case "১. সাইট অনুসন্ধান":
                  return PhaseInfo(title: "সাইট অনুসন্ধান", icon: "binoculars.fill",
                                  color: Color(red: 0.55, green: 0.35, blue: 0.15),
                                  gradient: [Color(red: 0.45, green: 0.28, blue: 0.10), Color(red: 0.78, green: 0.55, blue: 0.30)])
              case "২. ডিজাইন ও পরিকল্পনা":
                  return PhaseInfo(title: "ডিজাইন ও পরিকল্পনা", icon: "pencil.and.ruler.fill",
                                  color: Color(red: 0.15, green: 0.45, blue: 0.85),
                                  gradient: [Color(red: 0.10, green: 0.35, blue: 0.75), Color(red: 0.35, green: 0.65, blue: 0.95)])
              case "৩. টিম ও ব্যবস্থাপনা":
                  return PhaseInfo(title: "টিম ও ব্যবস্থাপনা", icon: "person.3.fill",
                                  color: Color(red: 0.55, green: 0.25, blue: 0.75),
                                  gradient: [Color(red: 0.42, green: 0.18, blue: 0.65), Color(red: 0.75, green: 0.45, blue: 0.95)])
              case "৪. ইউটিলিটি সংযোগ":
                  return PhaseInfo(title: "ইউটিলিটি সংযোগ", icon: "bolt.horizontal.circle.fill",
                                  color: Color(red: 0.95, green: 0.55, blue: 0.15),
                                  gradient: [Color(red: 0.85, green: 0.42, blue: 0.08), Color(red: 1.00, green: 0.72, blue: 0.30)])
              case "৫. ক্রয় ও ঠিকাদার":
                  return PhaseInfo(title: "ক্রয় ও ঠিকাদার", icon: "cart.fill",
                                  color: Color(red: 0.15, green: 0.65, blue: 0.35),
                                  gradient: [Color(red: 0.10, green: 0.52, blue: 0.28), Color(red: 0.35, green: 0.82, blue: 0.52)])
              case "৬. সময়সূচি ও পরিকল্পনা":
                  return PhaseInfo(title: "সময়সূচি ও পরিকল্পনা", icon: "calendar.badge.clock",
                                  color: Color(red: 0.10, green: 0.65, blue: 0.65),
                                  gradient: [Color(red: 0.05, green: 0.50, blue: 0.55), Color(red: 0.30, green: 0.85, blue: 0.82)])
              case "৭. যন্ত্র ও শ্রমিক":
                  return PhaseInfo(title: "যন্ত্র ও শ্রমিক", icon: "wrench.and.screwdriver.fill",
                                  color: Color(red: 0.35, green: 0.35, blue: 0.75),
                                  gradient: [Color(red: 0.25, green: 0.25, blue: 0.62), Color(red: 0.55, green: 0.55, blue: 0.95)])
              case "৮. কাজ ও মান নিয়ন্ত্রণ":
                  return PhaseInfo(title: "কাজ ও মান নিয়ন্ত্রণ", icon: "checkmark.seal.fill",
                                  color: Color(red: 0.85, green: 0.25, blue: 0.25),
                                  gradient: [Color(red: 0.72, green: 0.18, blue: 0.18), Color(red: 1.00, green: 0.45, blue: 0.45)])
              case "৯. হস্তান্তর":
                  return PhaseInfo(title: "হস্তান্তর", icon: "key.fill",
                                  color: Color(red: 0.45, green: 0.45, blue: 0.50),
                                  gradient: [Color(red: 0.35, green: 0.35, blue: 0.42), Color(red: 0.65, green: 0.65, blue: 0.70)])
              default:
                  return PhaseInfo(title: name ?? "Other", icon: "circle.fill",
                                  color: .gray, gradient: [.gray, .secondary])
              }
          }

          // MARK: - App
          @main struct SiteBookApp: App {
              var body: some Scene { WindowGroup { RootView() } }
          }

          // MARK: - Store (Bookmarks + Selection)
          final class AppState: ObservableObject {
              @Published var bookmarks: Set<Int> = []
              func toggle(_ id: Int) {
                  if bookmarks.contains(id) { bookmarks.remove(id) } else { bookmarks.insert(id) }
              }
          }

          // MARK: - Root with TabView
          struct RootView: View {
              let topics = loadTopics()
              @StateObject var state = AppState()

              var body: some View {
                  TabView {
                      HomeView(topics: topics)
                          .tabItem { Label("হোম", systemImage: "square.grid.2x2.fill") }
                      ContentsView(topics: topics)
                          .tabItem { Label("সূচি", systemImage: "list.bullet.rectangle.portrait.fill") }
                      BookmarksView(topics: topics)
                          .tabItem { Label("বুকমার্ক", systemImage: "bookmark.fill") }
                  }
                  .environmentObject(state)
                  .tint(.blue)
              }
          }

          // MARK: - Home (Phase Cards)
          struct HomeView: View {
              let topics: [Topic]
              let phases = ["১. সাইট অনুসন্ধান","২. ডিজাইন ও পরিকল্পনা","৩. টিম ও ব্যবস্থাপনা","৪. ইউটিলিটি সংযোগ","৫. ক্রয় ও ঠিকাদার","৬. সময়সূচি ও পরিকল্পনা","৭. যন্ত্র ও শ্রমিক","৮. কাজ ও মান নিয়ন্ত্রণ","৯. হস্তান্তর"]

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 14) {
                              // Hero banner
                              ZStack(alignment: .leading) {
                                  LinearGradient(colors: [Color(red:0.10,green:0.35,blue:0.75), Color(red:0.35,green:0.65,blue:0.95)], startPoint: .topLeading, endPoint: .bottomTrailing)
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text("SiteBook").font(.largeTitle).bold().foregroundColor(.white)
                                      Text("নির্মাণ প্রকল্পের সম্পূর্ণ গাইড").font(.subheadline).foregroundColor(.white.opacity(0.9))
                                      HStack(spacing: 18) {
                                          VStack(alignment: .leading) {
                                              Text("\(topics.count)").font(.title2).bold().foregroundColor(.white)
                                              Text("টপিক").font(.caption).foregroundColor(.white.opacity(0.8))
                                          }
                                          VStack(alignment: .leading) {
                                              Text("9").font(.title2).bold().foregroundColor(.white)
                                              Text("ধাপ").font(.caption).foregroundColor(.white.opacity(0.8))
                                          }
                                      }.padding(.top, 6)
                                  }
                                  .padding(20)
                              }
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .clipShape(RoundedRectangle(cornerRadius: 18))
                              .shadow(color: .blue.opacity(0.25), radius: 10, y: 6)
                              .padding(.horizontal)

                              Text("ধাপসমূহ").font(.headline).frame(maxWidth: .infinity, alignment: .leading).padding(.horizontal).padding(.top, 6)

                              ForEach(phases, id: \.self) { ph in
                                  let info = phaseInfo(ph)
                                  let count = topics.filter { $0.phase == ph }.count
                                  NavigationLink(destination: PhaseListView(phase: ph, topics: topics)) {
                                      HStack(spacing: 14) {
                                          ZStack {
                                              LinearGradient(colors: info.gradient, startPoint: .topLeading, endPoint: .bottomTrailing)
                                              Image(systemName: info.icon)
                                                  .font(.system(size: 22, weight: .semibold))
                                                  .foregroundColor(.white)
                                          }
                                          .frame(width: 52, height: 52)
                                          .clipShape(RoundedRectangle(cornerRadius: 14))

                                          VStack(alignment: .leading, spacing: 3) {
                                              Text(info.title).font(.headline).foregroundColor(.primary)
                                              Text("\(count) টপিক").font(.caption).foregroundColor(.secondary)
                                          }
                                          Spacer()
                                          Image(systemName: "chevron.right").foregroundColor(.secondary.opacity(0.6))
                                      }
                                      .padding(14)
                                      .background(Color(.secondarySystemGroupedBackground))
                                      .clipShape(RoundedRectangle(cornerRadius: 16))
                                      .overlay(RoundedRectangle(cornerRadius: 16).stroke(Color.secondary.opacity(0.08), lineWidth: 1))
                                      .shadow(color: info.color.opacity(0.10), radius: 8, y: 3)
                                      .padding(.horizontal)
                                  }
                              }
                          }.padding(.vertical)
                      }
                      .background(Color(.systemGroupedBackground))
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          // MARK: - Phase List
          struct PhaseListView: View {
              let phase: String
              let topics: [Topic]
              var body: some View {
                  let info = phaseInfo(phase)
                  let filtered = topics.filter { $0.phase == phase }
                  List {
                      ForEach(filtered) { t in
                          NavigationLink(destination: TopicView(t: t)) {
                              HStack(spacing: 12) {
                                  ZStack {
                                      Circle().fill(LinearGradient(colors: info.gradient, startPoint: .topLeading, endPoint: .bottomTrailing))
                                      Text("\(t.id)").font(.caption).bold().foregroundColor(.white)
                                  }.frame(width: 36, height: 36)
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(t.en).font(.subheadline).bold().lineLimit(2)
                                      Text(t.bn).font(.caption).foregroundColor(.secondary).lineLimit(1)
                                  }
                              }.padding(.vertical, 4)
                          }
                      }
                  }
                  .navigationTitle(info.title)
                  .navigationBarTitleDisplayMode(.inline)
              }
          }

          // MARK: - Contents (all grouped)
          struct ContentsView: View {
              let topics: [Topic]
              let phases = ["১. সাইট অনুসন্ধান","২. ডিজাইন ও পরিকল্পনা","৩. টিম ও ব্যবস্থাপনা","৪. ইউটিলিটি সংযোগ","৫. ক্রয় ও ঠিকাদার","৬. সময়সূচি ও পরিকল্পনা","৭. যন্ত্র ও শ্রমিক","৮. কাজ ও মান নিয়ন্ত্রণ","৯. হস্তান্তর"]
              @State private var q = ""

              var filtered: [Topic] {
                  let s = q.lowercased().trimmingCharacters(in: .whitespaces)
                  if s.isEmpty { return topics }
                  return topics.filter { t in
                      let all = [t.en, t.bn, t.what ?? "", t.why ?? "", t.uses ?? "", t.duration ?? ""]
                          + (t.steps ?? []) + (t.ways ?? []) + (t.sources ?? []) + (t.examples ?? [])
                          + (t.keyPoints ?? []) + (t.mistakes ?? []) + (t.tips ?? [])
                      return all.joined(separator: " ").lowercased().contains(s)
                  }
              }

              var body: some View {
                  NavigationStack {
                      List {
                          ForEach(phases, id: \.self) { ph in
                              let items = filtered.filter { $0.phase == ph }
                              if !items.isEmpty {
                                  let info = phaseInfo(ph)
                                  Section {
                                      ForEach(items) { t in
                                          NavigationLink(destination: TopicView(t: t)) {
                                              HStack(spacing: 10) {
                                                  Image(systemName: info.icon).foregroundColor(info.color)
                                                  VStack(alignment: .leading, spacing: 2) {
                                                      Text("\(t.id). \(t.en)").font(.subheadline).bold()
                                                      Text(t.bn).font(.caption).foregroundColor(.secondary)
                                                  }
                                              }
                                          }
                                      }
                                  } header: {
                                      HStack {
                                          Image(systemName: info.icon)
                                          Text(info.title)
                                      }.foregroundColor(info.color)
                                  }
                              }
                          }
                      }
                      .navigationTitle("সূচিপত্র")
                      .searchable(text: $q, prompt: "টপিক, ধাপ, কীওয়ার্ড খুঁজুন")
                  }
              }
          }

          // MARK: - Bookmarks
          struct BookmarksView: View {
              let topics: [Topic]
              @EnvironmentObject var state: AppState
              var body: some View {
                  NavigationStack {
                      List {
                          ForEach(topics.filter { state.bookmarks.contains($0.id) }) { t in
                              NavigationLink(destination: TopicView(t: t)) {
                                  HStack(spacing: 10) {
                                      let info = phaseInfo(t.phase)
                                      Image(systemName: info.icon).foregroundColor(info.color)
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("\(t.id). \(t.en)").font(.subheadline).bold()
                                          Text(t.bn).font(.caption).foregroundColor(.secondary)
                                      }
                                  }
                              }
                          }
                      }
                      .navigationTitle("বুকমার্ক")
                  }
              }
          }

          // MARK: - Reusable Card
          struct Card<Content: View>: View {
              let title: String
              let icon: String
              let color: Color
              @ViewBuilder var content: Content

              var body: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack(spacing: 8) {
                          Image(systemName: icon).font(.system(size: 15, weight: .semibold)).foregroundColor(color)
                          Text(title).font(.headline).foregroundColor(color)
                      }
                      content
                  }
                  .padding(14)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .background(Color(.secondarySystemGroupedBackground))
                  .clipShape(RoundedRectangle(cornerRadius: 14))
                  .overlay(RoundedRectangle(cornerRadius: 14).stroke(color.opacity(0.12), lineWidth: 1))
              }
          }

          // MARK: - Topic Detail (premium)
          struct TopicView: View {
              let t: Topic
              @EnvironmentObject var state: AppState

              var body: some View {
                  let info = phaseInfo(t.phase)
                  ScrollView {
                      VStack(spacing: 14) {
                          // Hero
                          ZStack(alignment: .bottomLeading) {
                              LinearGradient(colors: info.gradient, startPoint: .topLeading, endPoint: .bottomTrailing)
                              VStack(alignment: .leading, spacing: 8) {
                                  HStack {
                                      HStack(spacing: 6) {
                                          Image(systemName: info.icon)
                                          Text(info.title)
                                      }
                                      .font(.caption).bold()
                                      .padding(.horizontal, 10).padding(.vertical, 5)
                                      .background(Color.white.opacity(0.22))
                                      .foregroundColor(.white)
                                      .clipShape(Capsule())
                                      Spacer()
                                      Text("#\(t.id)").font(.caption).bold()
                                          .padding(.horizontal, 10).padding(.vertical, 5)
                                          .background(Color.white.opacity(0.22))
                                          .foregroundColor(.white)
                                          .clipShape(Capsule())
                                  }
                                  Text(t.en).font(.title2).bold().foregroundColor(.white)
                                  Text(t.bn).font(.title3).foregroundColor(.white.opacity(0.95))
                                  if let d = t.duration, !d.isEmpty {
                                      HStack(spacing: 6) {
                                          Image(systemName: "clock.fill")
                                          Text(d)
                                      }.font(.caption).foregroundColor(.white.opacity(0.9))
                                  }
                              }
                              .padding(18)
                          }
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .clipShape(RoundedRectangle(cornerRadius: 18))
                          .shadow(color: info.color.opacity(0.30), radius: 12, y: 6)

                          // Key Points
                          if let kp = t.keyPoints, !kp.isEmpty {
                              Card(title: "মূল তথ্য", icon: "star.circle.fill", color: info.color) {
                                  VStack(alignment: .leading, spacing: 6) {
                                      ForEach(kp, id: \.self) { k in
                                          HStack(alignment: .top, spacing: 8) {
                                              Image(systemName: "sparkle").font(.caption).foregroundColor(info.color).padding(.top, 3)
                                              Text(k).font(.subheadline)
                                          }
                                      }
                                  }
                              }
                          }

                          // What
                          if let w = t.what, !w.isEmpty {
                              Card(title: "এটা কী?", icon: "info.circle.fill", color: .blue) {
                                  Text(w).font(.subheadline).lineSpacing(3)
                              }
                          }
                          // Uses
                          if let u = t.uses, !u.isEmpty {
                              Card(title: "কী কাজে লাগে?", icon: "target", color: .green) {
                                  Text(u).font(.subheadline).lineSpacing(3)
                              }
                          }
                          // Why
                          if let w = t.why, !w.isEmpty {
                              Card(title: "কেন জরুরি?", icon: "exclamationmark.triangle.fill", color: .orange) {
                                  Text(w).font(.subheadline).lineSpacing(3)
                              }
                          }

                          // Steps timeline
                          if let s = t.steps, !s.isEmpty {
                              Card(title: "ধাপসমূহ", icon: "list.number", color: .blue) {
                                  VStack(alignment: .leading, spacing: 10) {
                                      ForEach(Array(s.enumerated()), id: \.offset) { i, step in
                                          HStack(alignment: .top, spacing: 10) {
                                              ZStack {
                                                  Circle().fill(info.gradient[0])
                                                  Text("\(i+1)").font(.caption2).bold().foregroundColor(.white)
                                              }.frame(width: 22, height: 22)
                                              Text(step).font(.subheadline)
                                          }
                                      }
                                  }
                              }
                          }

                          // Mistakes
                          if let m = t.mistakes, !m.isEmpty {
                              Card(title: "সাধারণ ভুল", icon: "xmark.octagon.fill", color: .red) {
                                  VStack(alignment: .leading, spacing: 6) {
                                      ForEach(m, id: \.self) { x in
                                          HStack(alignment: .top, spacing: 8) {
                                              Image(systemName: "xmark").font(.caption).foregroundColor(.red).padding(.top, 3)
                                              Text(x).font(.subheadline)
                                          }
                                      }
                                  }
                              }
                          }

                          // Tips
                          if let tp = t.tips, !tp.isEmpty {
                              Card(title: "প্রো টিপস", icon: "lightbulb.fill", color: .yellow) {
                                  VStack(alignment: .leading, spacing: 6) {
                                      ForEach(tp, id: \.self) { x in
                                          HStack(alignment: .top, spacing: 8) {
                                              Image(systemName: "checkmark.seal.fill").font(.caption).foregroundColor(.yellow).padding(.top, 3)
                                              Text(x).font(.subheadline)
                                          }
                                      }
                                  }
                              }
                          }

                          // Ways
                          if let w = t.ways, !w.isEmpty {
                              Card(title: "পদ্ধতি / ধরন", icon: "square.stack.3d.up.fill", color: .purple) {
                                  VStack(alignment: .leading, spacing: 6) {
                                      ForEach(w, id: \.self) { x in
                                          HStack(alignment: .top, spacing: 8) {
                                              Image(systemName: "circle.fill").font(.system(size: 6)).foregroundColor(.purple).padding(.top, 6)
                                              Text(x).font(.subheadline)
                                          }
                                      }
                                  }
                              }
                          }

                          // Examples
                          if let ex = t.examples, !ex.isEmpty {
                              Card(title: "উদাহরণ", icon: "doc.text.magnifyingglass", color: .indigo) {
                                  VStack(alignment: .leading, spacing: 8) {
                                      ForEach(Array(ex.enumerated()), id: \.offset) { i, e in
                                          HStack(alignment: .top, spacing: 8) {
                                              Text("\(i+1).").font(.caption).bold().foregroundColor(.indigo).padding(.top, 2)
                                              Text(e).font(.subheadline)
                                          }
                                      }
                                  }
                              }
                          }

                          // Sources
                          if let s = t.sources, !s.isEmpty {
                              Card(title: "সোর্স / রেফারেন্স", icon: "book.closed.fill", color: .teal) {
                                  VStack(alignment: .leading, spacing: 6) {
                                      ForEach(s, id: \.self) { x in
                                          HStack(alignment: .top, spacing: 8) {
                                              Image(systemName: "bookmark.fill").font(.caption).foregroundColor(.teal).padding(.top, 3)
                                              Text(x).font(.footnote)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      .padding()
                  }
                  .background(Color(.systemGroupedBackground))
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .topBarTrailing) {
                          Button {
                              state.toggle(t.id)
                          } label: {
                              Image(systemName: state.bookmarks.contains(t.id) ? "bookmark.fill" : "bookmark")
                          }
                      }
                  }
              }
          }
          EOF_SWIFT
          cat > Sources/topics.json <<'EOF_JSON'
          [
           {
            "id": 1,
            "en": "Soil Test (N-value, Soil Strength)",
            "bn": "মাটি পরীক্ষা (এন-ভ্যালু, মাটির শক্তি)",
            "phase": "১. সাইট অনুসন্ধান",
            "duration": "২–৪ সপ্তাহ (বড় সাইটে ৬ সপ্তাহ)",
