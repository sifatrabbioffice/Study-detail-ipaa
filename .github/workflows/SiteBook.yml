name: Build unsigned IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create project files
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF_PROJ'
          name: SiteBook
          options: {bundleIdPrefix: com.sitebook}
          targets:
            SiteBook:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.sitebook.app
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_CFBundleDisplayName: SiteBook
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
          EOF_PROJ
          cat > Sources/App.swift <<'EOF_SWIFT'
          import SwiftUI

          struct Topic: Codable, Identifiable, Hashable {
              var id: Int
              var en: String
              var bn: String
              var phase: String?
              var what: String?
              var why: String?
              var uses: String?
              var steps: [String]?
              var ways: [String]?
              var sources: [String]?
              var examples: [String]?
              var mistakes: [String]?
              var checklist: [String]?
              var tips: [String]?
              var risks: [String]?

              var haystack: String {
                  let all = [en, bn, what ?? "", why ?? "", uses ?? ""]
                      + (steps ?? []) + (ways ?? []) + (sources ?? []) + (examples ?? [])
                      + (mistakes ?? []) + (tips ?? []) + (risks ?? []) + (checklist ?? [])
                  return all.joined(separator: " ").lowercased()
              }
              var total: Int {
                  (steps?.count ?? 0) + (ways?.count ?? 0) + (sources?.count ?? 0) + (examples?.count ?? 0)
                  + (mistakes?.count ?? 0) + (tips?.count ?? 0) + (risks?.count ?? 0) + (checklist?.count ?? 0)
              }
          }

          func loadTopics() -> [Topic] {
              guard let u = Bundle.main.url(forResource: "topics", withExtension: "json"),
                    let d = try? Data(contentsOf: u),
                    var t = try? JSONDecoder().decode([Topic].self, from: d) else { return [] }
              // Merge optional extras.json: { "1": { "tips": [], "mistakes": [], "risks": [], "checklist": [] } }
              if let eu = Bundle.main.url(forResource: "extras", withExtension: "json"),
                 let ed = try? Data(contentsOf: eu),
                 let ex = try? JSONDecoder().decode([String: [String: [String]]].self, from: ed) {
                  for i in t.indices {
                      if let e = ex["\(t[i].id)"] {
                          t[i].tips = e["tips"] ?? t[i].tips
                          t[i].mistakes = e["mistakes"] ?? t[i].mistakes
                          t[i].risks = e["risks"] ?? t[i].risks
                          t[i].checklist = e["checklist"] ?? t[i].checklist
                      }
                  }
              }
              return t
          }

          final class Store: ObservableObject {
              @Published var topics: [Topic] = loadTopics()
              @Published var favs: Set<Int> { didSet { UserDefaults.standard.set(Array(favs), forKey: "favs") } }
              @Published var done: Set<Int> { didSet { UserDefaults.standard.set(Array(done), forKey: "done") } }
              @Published var notes: [String: String] { didSet { UserDefaults.standard.set(notes, forKey: "notes") } }

              init() {
                  favs = Set(UserDefaults.standard.array(forKey: "favs") as? [Int] ?? [])
                  done = Set(UserDefaults.standard.array(forKey: "done") as? [Int] ?? [])
                  notes = UserDefaults.standard.dictionary(forKey: "notes") as? [String: String] ?? [:]
              }
              var phases: [String] {
                  var seen = Set<String>()
                  return topics.compactMap { $0.phase }.filter { seen.insert($0).inserted }
              }
              func color(_ p: String?) -> Color {
                  let pal: [Color] = [.blue, .purple, .orange, .teal, .pink, .indigo, .green, .red, .brown]
                  guard let p = p, let i = phases.firstIndex(of: p) else { return .gray }
                  return pal[i % pal.count]
              }
              func toggleFav(_ id: Int) { if favs.contains(id) { favs.remove(id) } else { favs.insert(id) } }
              func toggleDone(_ id: Int) { if done.contains(id) { done.remove(id) } else { done.insert(id) } }
          }

          @main struct SiteBookApp: App {
              @StateObject private var store = Store()
              var body: some Scene {
                  WindowGroup { HomeView().environmentObject(store) }
              }
          }

          struct HomeView: View {
              @EnvironmentObject var s: Store
              @State private var q = ""
              @State private var phase: String? = nil
              @State private var onlyFav = false

              var list: [Topic] {
                  s.topics.filter { t in
                      (phase == nil || t.phase == phase)
                      && (!onlyFav || s.favs.contains(t.id))
                      && (q.isEmpty || t.haystack.contains(q.lowercased()))
                  }
              }
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 14) {
                              hero
                              chips
                              if list.isEmpty {
                                  Text("কিছু পাওয়া যায়নি").foregroundColor(.secondary).padding(.top, 40)
                              }
                              LazyVStack(spacing: 10) {
                                  ForEach(list) { t in
                                      NavigationLink(value: t) { row(t) }.buttonStyle(.plain)
                                  }
                              }
                          }.padding()
                      }
                      .background(Color(.systemGroupedBackground))
                      .navigationTitle("SiteBook")
                      .searchable(text: $q, prompt: "Search / খুঁজুন")
                      .navigationDestination(for: Topic.self) { DetailView(start: $0.id) }
                  }
              }
              var hero: some View {
                  let n = s.topics.count, d = s.done.count
                  return VStack(alignment: .leading, spacing: 10) {
                      Text("নির্মাণ জ্ঞানকোষ").font(.title2).bold()
                      Text("\(n) টপিক • \(s.phases.count) ধাপ • \(s.favs.count) ফেভারিট")
                          .font(.subheadline).opacity(0.9)
                      ProgressView(value: Double(d), total: Double(max(n, 1))).tint(.white)
                      Text("সম্পন্ন: \(d)/\(n)").font(.caption).opacity(0.9)
                  }
                  .foregroundColor(.white).padding(18).frame(maxWidth: .infinity, alignment: .leading)
                  .background(LinearGradient(colors: [.indigo, .blue, .teal], startPoint: .topLeading, endPoint: .bottomTrailing))
                  .clipShape(RoundedRectangle(cornerRadius: 20))
                  .shadow(color: .blue.opacity(0.3), radius: 10, y: 5)
              }
              var chips: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack {
                          chip("সব", on: phase == nil && !onlyFav, c: .blue) { phase = nil; onlyFav = false }
                          chip("⭐ ফেভারিট", on: onlyFav, c: .orange) { onlyFav.toggle(); phase = nil }
                          ForEach(s.phases, id: \.self) { p in
                              chip(p, on: phase == p, c: s.color(p)) { phase = (phase == p ? nil : p); onlyFav = false }
                          }
                      }
                  }
              }
              func chip(_ t: String, on: Bool, c: Color, _ a: @escaping () -> Void) -> some View {
                  Button(action: a) {
                      Text(t).font(.footnote).bold().padding(.horizontal, 12).padding(.vertical, 8)
                          .background(on ? c : c.opacity(0.12)).foregroundColor(on ? .white : c)
                          .clipShape(Capsule())
                  }
              }
              func row(_ t: Topic) -> some View {
                  HStack(spacing: 12) {
                      Text("\(t.id)").font(.subheadline).bold().foregroundColor(.white)
                          .frame(width: 38, height: 38).background(s.color(t.phase)).clipShape(Circle())
                      VStack(alignment: .leading, spacing: 3) {
                          Text(t.en).font(.headline).foregroundColor(.primary).multilineTextAlignment(.leading)
                          Text(t.bn).font(.subheadline).foregroundColor(.secondary).multilineTextAlignment(.leading)
                          Text(t.phase ?? "").font(.caption2).foregroundColor(s.color(t.phase))
                      }
                      Spacer()
                      if s.done.contains(t.id) { Image(systemName: "checkmark.circle.fill").foregroundColor(.green) }
                      if s.favs.contains(t.id) { Image(systemName: "star.fill").foregroundColor(.orange) }
                  }
                  .padding(12).frame(maxWidth: .infinity)
                  .background(Color(.secondarySystemGroupedBackground))
                  .clipShape(RoundedRectangle(cornerRadius: 16))
              }
          }

          struct Card<Content: View>: View {
              let title: String, icon: String, color: Color
              let content: Content
              init(_ title: String, _ icon: String, _ color: Color, @ViewBuilder content: () -> Content) {
                  self.title = title; self.icon = icon; self.color = color; self.content = content()
              }
              var body: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Label(title, systemImage: icon).font(.headline).foregroundColor(color)
                      content
                  }
                  .frame(maxWidth: .infinity, alignment: .leading).padding(16)
                  .background(Color(.secondarySystemGroupedBackground))
                  .clipShape(RoundedRectangle(cornerRadius: 16))
              }
          }

          struct DetailView: View {
              @EnvironmentObject var s: Store
              @AppStorage("fs") private var fs: Double = 16
              @State private var cur: Int
              init(start: Int) { _cur = State(initialValue: start) }

              var idx: Int? { s.topics.firstIndex { $0.id == cur } }
              var t: Topic? { idx.map { s.topics[$0] } }

              var body: some View {
                  ScrollView {
                      if let t = t {
                          let c = s.color(t.phase)
                          VStack(alignment: .leading, spacing: 14) {
                              header(t, c)
                              analysis(t, c)
                              text("এটা কী? (What)", "questionmark.circle.fill", c, t.what)
                              text("ব্যবহার (Use)", "wrench.and.screwdriver.fill", c, t.uses)
                              text("কেন করা হয়? (Why)", "exclamationmark.triangle.fill", .orange, t.why)
                              list("ধাপসমূহ (Steps)", "list.number", c, t.steps, numbered: true)
                              list("পদ্ধতি (Ways)", "arrow.triangle.branch", .purple, t.ways)
                              list("উদাহরণ (Examples)", "lightbulb.fill", .yellow, t.examples, numbered: true)
                              list("সাধারণ ভুল (Mistakes)", "xmark.octagon.fill", .red, t.mistakes)
                              list("ঝুঁকি (Risks)", "flame.fill", .red, t.risks)
                              list("টিপস (Tips)", "sparkles", .teal, t.tips)
                              list("চেকলিস্ট (Checklist)", "checkmark.square.fill", .green, t.checklist)
                              list("সোর্স (Sources)", "books.vertical.fill", .gray, t.sources)
                              if t.what == nil {
                                  Text("বিস্তারিত তথ্য শিগগিরই যোগ হবে।").italic().foregroundColor(.secondary)
                              }
                              noteBox
                              nav
                          }.padding()
                      }
                  }
                  .background(Color(.systemGroupedBackground))
                  .navigationTitle("টপিক \(cur)")
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItemGroup(placement: .navigationBarTrailing) {
                          if let t = t {
                              Button { s.toggleFav(t.id) } label: {
                                  Image(systemName: s.favs.contains(t.id) ? "star.fill" : "star")
                              }
                              ShareLink(item: shareText(t))
                          }
                          Menu {
                              Stepper("লেখার সাইজ: \(Int(fs))", value: $fs, in: 13...26)
                          } label: { Image(systemName: "textformat.size") }
                      }
                  }
              }

              func header(_ t: Topic, _ c: Color) -> some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text(t.phase ?? "").font(.caption).bold().padding(.horizontal, 10).padding(.vertical, 4)
                          .background(Color.white.opacity(0.25)).clipShape(Capsule())
                      Text(t.en).font(.title2).bold()
                      Text(t.bn).font(.title3).opacity(0.92)
                      Button { s.toggleDone(t.id) } label: {
                          Label(s.done.contains(t.id) ? "সম্পন্ন ✔" : "সম্পন্ন চিহ্নিত করুন",
                                systemImage: s.done.contains(t.id) ? "checkmark.circle.fill" : "circle")
                              .font(.footnote).bold().padding(.horizontal, 12).padding(.vertical, 8)
                              .background(Color.white.opacity(0.22)).clipShape(Capsule())
                      }
                  }
                  .foregroundColor(.white).padding(18).frame(maxWidth: .infinity, alignment: .leading)
                  .background(LinearGradient(colors: [c, c.opacity(0.65)], startPoint: .topLeading, endPoint: .bottomTrailing))
                  .clipShape(RoundedRectangle(cornerRadius: 20))
              }

              func analysis(_ t: Topic, _ c: Color) -> some View {
                  Card("দ্রুত বিশ্লেষণ (Analysis)", "chart.bar.fill", c) {
                      HStack {
                          stat("ধাপ", t.steps?.count ?? 0, c)
                          stat("পদ্ধতি", t.ways?.count ?? 0, .purple)
                          stat("উদাহরণ", t.examples?.count ?? 0, .orange)
                          stat("সোর্স", t.sources?.count ?? 0, .gray)
                      }
                      HStack {
                          stat("ভুল", t.mistakes?.count ?? 0, .red)
                          stat("ঝুঁকি", t.risks?.count ?? 0, .red)
                          stat("টিপস", t.tips?.count ?? 0, .teal)
                          stat("চেক", t.checklist?.count ?? 0, .green)
                      }
                      ProgressView(value: min(1.0, Double(t.total) / 24.0)).tint(c)
                      Text(t.total > 16 ? "গভীরতা: বিস্তারিত" : t.total > 9 ? "গভীরতা: মাঝারি" : "গভীরতা: সংক্ষিপ্ত")
                          .font(.caption).foregroundColor(.secondary)
                  }
              }
              func stat(_ n: String, _ v: Int, _ c: Color) -> some View {
                  VStack {
                      Text("\(v)").font(.title3).bold().foregroundColor(c)
                      Text(n).font(.caption2).foregroundColor(.secondary)
                  }.frame(maxWidth: .infinity)
              }

              @ViewBuilder func text(_ title: String, _ icon: String, _ c: Color, _ v: String?) -> some View {
                  if let v = v, !v.isEmpty {
                      Card(title, icon, c) {
                          Text(v).font(.system(size: fs)).lineSpacing(5).textSelection(.enabled)
                      }
                  }
              }
              @ViewBuilder func list(_ title: String, _ icon: String, _ c: Color, _ items: [String]?, numbered: Bool = false) -> some View {
                  if let items = items, !items.isEmpty {
                      Card(title, icon, c) {
                          ForEach(Array(items.enumerated()), id: \.offset) { i, x in
                              HStack(alignment: .top, spacing: 10) {
                                  if numbered {
                                      Text("\(i + 1)").font(.caption).bold().foregroundColor(.white)
                                          .frame(width: 22, height: 22).background(c).clipShape(Circle())
                                  } else {
                                      Circle().fill(c).frame(width: 7, height: 7).padding(.top, 8)
                                  }
                                  Text(x).font(.system(size: fs)).lineSpacing(4).textSelection(.enabled)
                              }
                          }
                      }
                  }
              }
              var noteBox: some View {
                  let b = Binding<String>(
                      get: { s.notes["\(cur)"] ?? "" },
                      set: { s.notes["\(cur)"] = $0 })
                  return Card("আমার নোট (Notes)", "square.and.pencil", .blue) {
                      TextEditor(text: b).frame(minHeight: 90)
                          .scrollContentBackground(.hidden)
                          .padding(6).background(Color(.systemGray6)).clipShape(RoundedRectangle(cornerRadius: 10))
                  }
              }
              var nav: some View {
                  HStack {
                      Button { if let i = idx, i > 0 { cur = s.topics[i - 1].id } } label: {
                          Label("আগের", systemImage: "chevron.left")
                      }.disabled((idx ?? 0) == 0)
                      Spacer()
                      Button { if let i = idx, i < s.topics.count - 1 { cur = s.topics[i + 1].id } } label: {
                          Label("পরের", systemImage: "chevron.right")
                      }.disabled((idx ?? 0) >= s.topics.count - 1)
                  }
                  .buttonStyle(.borderedProminent).padding(.bottom, 20)
              }
              func shareText(_ t: Topic) -> String {
                  var o = "\(t.en)\n\(t.bn)\n\n\(t.what ?? "")"
                  if let st = t.steps { o += "\n\nধাপ:\n" + st.enumerated().map { "\($0.offset + 1). \($0.element)" }.joined(separator: "\n") }
                  return o
              }
          }
          EOF_SWIFT
          cat > Sources/extras.json <<'EOF_EXTRAS'
          {
           "1": {
            "mistakes": [
             "প্রয়োজনের চেয়ে কম বোরহোল করা, ফলে সাইটের পুরো মাটির চিত্র ধরা পড়ে না",
             "পানির লেভেল রেকর্ড না করা",
             "রিপোর্ট না পড়েই পুরনো আশপাশের ভবনের ডিজাইন নকল করা"
            ],
            "risks": [
             "ভুল ফাউন্ডেশনে অসম বসে যাওয়া ও ফাটল",
             "ভূমিকম্পে Liquefaction-এ ভবনের কাত হয়ে যাওয়া"
            ],
            "tips": [
             "বর্ষার শেষে ও শুষ্ক মৌসুমে পানির লেভেল আলাদা হতে পারে—সময় উল্লেখ করুন",
             "পাশের প্লটের বোরলগ থাকলে তুলনা করে দেখুন"
            ],
            "checklist": [
             "বোরহোলের অবস্থান প্ল্যানে চিহ্নিত",
             "প্রতি ১.৫ মি-এ SPT রেকর্ড",
             "ল্যাব টেস্টের রিপোর্ট সংযুক্ত",
             "স্ট্রাকচারাল ইঞ্জিনিয়ার রিপোর্ট বুঝে নিয়েছেন"
            ]
           },
           "2": {
            "mistakes": [
             "শুধু পুরনো খতিয়ানের মাপে বিশ্বাস করে সরেজমিনে না মেলানো",
             "কন্ট্রোল পয়েন্ট ছাড়া Total Station বসানো",
             "পাশের জমির দখল সীমানা যাচাই না করা"
            ],
            "risks": [
             "সীমানা বিরোধে মামলা ও কাজ বন্ধ",
             "ভুল লেভেলে ড্রেনেজ উল্টো দিকে বইতে পারে"
            ],
            "tips": [
             "স্থায়ী বেঞ্চমার্ক সাইটের বাইরে নিরাপদ জায়গায় রাখুন",
             "বাউন্ডারি পিলারের ছবি ও কোঅর্ডিনেট ফাইলে সংরক্ষণ করুন"
            ],
            "checklist": [
             "দলিল-খতিয়ানের সাথে ক্ষেত্রফল মিলানো",
             "সবকটি কর্নারের কোঅর্ডিনেট",
             "গ্রিড লেভেল ও কনট্যুর",
             "সার্ভেয়ারের স্বাক্ষর"
            ]
           },
           "3": {
            "mistakes": [
             "ফায়ার ট্রাকের টার্নিং রেডিয়াস বিবেচনা না করা",
             "STP ও সাবস্টেশনের জায়গা শেষ মুহূর্তে খোঁজা",
             "সেটব্যাক ও FAR হিসাব ভুল ধরা"
            ],
            "risks": [
             "অনুমোদন বাতিল বা দেরি",
             "ভবিষ্যতে সম্প্রসারণে জায়গার অভাব"
            ],
            "tips": [
             "প্রযোজ্য FAR ও সেটব্যাক সবসময় সর্বশেষ নিয়ম থেকে যাচাই করুন",
             "দক্ষিণমুখী খোলা জায়গা রেখে আলো-বাতাস বাড়ান"
            ],
            "checklist": [
             "FAR ও MGC হিসাব শিট",
             "ফায়ার লেন ও অ্যাক্সেস",
             "পার্কিং সংখ্যা",
             "সবুজ এলাকা ও ড্রেনেজ"
            ]
           },
           "4": {
            "mistakes": [
             "রুমের মাপ নিয়েছেন কিন্তু দেয়ালের পুরুত্ব ধরেননি",
             "সিঁড়ির হেডরুম কম রাখা",
             "প্লাম্বিং শ্যাফট ও ডাক্টের জায়গা না রাখা"
            ],
            "risks": [
             "কোড লঙ্ঘনে অনুমোদন আটকে যাওয়া",
             "ডিজাইন বদলে ঢালাইয়ের পর বড় খরচ"
            ],
