          "uses":"হস্তান্তরের পরে প্রকাশ পাওয়া লুকানো ত্রুটি (লিক, ফাটল, ফিনিশের সমস্যা) বিনা খরচে সারানো।",
          "why":"অনেক ত্রুটি বর্ষা বা ব্যবহারের পর বোঝা যায়; DLP না থাকলে মালিক মেরামতের খরচ নিজে বহন করেন।",
          "steps":["চুক্তিতে DLP-এর সময় ও রিটেনশন শতাংশ নির্ধারণ","হস্তান্তরের তারিখ থেকে DLP শুরু","ত্রুটির রিপোর্ট লিখিতভাবে ও ছবিসহ জানানো","ঠিকাদার নির্ধারিত সময়ে মেরামত করে স্বাক্ষর নেওয়া","DLP শেষে চূড়ান্ত পরিদর্শন","রিটেনশন মানি ছাড়"],
          "ways":["Retention Money","Performance Bond","ব্যাংক গ্যারান্টি"],
          "sources":["Contract Agreement","FIDIC/স্থানীয় চুক্তি ফর্ম (প্রযোজ্য হলে)"],
