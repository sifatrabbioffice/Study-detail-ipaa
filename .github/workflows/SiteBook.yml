          "what":"কাজ শেষে ভবন মালিক বা ক্লায়েন্টকে বুঝিয়ে দেওয়ার প্রক্রিয়া, যেখানে সাইটে বাস্তবে যেভাবে কাজ হয়েছে তা দেখিয়ে এজ-বিল্ট ড্রয়িং, ম্যানুয়াল, ওয়ারেন্টি ও টেস্ট রিপোর্ট দেওয়া হয়।",
