          "steps":["সাইটের ঝুঁকি চিহ্নিত করে নিরাপত্তা পরিকল্পনা লেখা","সেফটি অফিসার নিয়োগ","সবাইকে PPE (হেলমেট, জুতা, গ্লাভস, হারনেস) দেওয়া","নতুন শ্রমিককে ইন্ডাকশন ট্রেনিং","দৈনিক টুলবক্স টক ও সাপ্তাহিক পরিদর্শন","ঘটনা ও নিয়ার-মিস লিখে রাখা ও সংশোধন"],
