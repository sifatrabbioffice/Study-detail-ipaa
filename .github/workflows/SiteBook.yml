          "examples":["ঢালাই কংক্রিটের পরিমাণ m³-এ আর রডের পরিমাণ কেজিতে বের করে আলাদা আইটেমে BOQ","বাজার দর বদলালে রডের রেট হালনাগাদ করে বাজেট সংশোধন"],
          "mistakes":["অপচয় (wastage) না ধরা","পুরনো রেট ব্যবহার করা"],
          "risks":["বাজেট ঘাটতি","ভ্যারিয়েশন বিরোধ"],
          "tips":["কন্টিনজেন্সি ধরে রাখুন","আইটেম কোড দিয়ে PR/PO-র সাথে যুক্ত করুন"],
          "checklist":["ড্রয়িং ভার্সন","Take-off শিট","রেট উৎস","BOQ অনুমোদন"]},
          {"id":67,"en":"Site Safety (HSE)","bn":"সাইট নিরাপত্তা (এইচএসই)","phase":"৮. কাজ ও মান নিয়ন্ত্রণ",
          "what":"Health, Safety & Environment—সাইটে দুর্ঘটনা, অসুস্থতা ও পরিবেশ ক্ষতি রোধের পরিকল্পিত ব্যবস্থা। এতে PPE, ঝুঁকি বিশ্লেষণ, প্রশিক্ষণ, স্ক্যাফোল্ডিং, উঁচুতে কাজ ও বিদ্যুৎ নিরাপত্তা অন্তর্ভুক্ত।",
